name: Fix notification login voice flow
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-notif-login-voice.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch notification lifecycle
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          
          old="""window.addEventListener('load',()=>{
            setPhaseClasses();
            setTimeout(()=>{
              setPhaseClasses();
              render();
              const s=seen();
              if(!prelogin()){all().forEach(n=>s.add(String(n.id)));saveSeen(s)}
            },700);
          });
          setInterval(()=>{
            setPhaseClasses();
            const now=fingerprint();
            if(now!==fp){render();checkNew()}else syncBadges();
          },1200);"""
          new="""window.addEventListener('load',()=>{
            setPhaseClasses();
            setTimeout(()=>{
              setPhaseClasses();
              render();
              if(!prelogin())checkNew();
            },700);
          });
          window.addEventListener('yardivo:login',()=>{
            try{sessionStorage.removeItem(SEEN)}catch(_){}
            setTimeout(()=>{
              setPhaseClasses();
              render();
              checkNew();
            },220);
          });
          ['yardivo:data-synced','yardivo:online-ready'].forEach(ev=>window.addEventListener(ev,()=>{
            setTimeout(()=>{
              if(prelogin())return;
              render();
              checkNew();
            },120);
          }));
          window.addEventListener('yardivo:logout',()=>{
            try{sessionStorage.removeItem(SEEN)}catch(_){}
            try{document.getElementById('yardivoToastStack')?.replaceChildren()}catch(_){}
            try{panel?.classList.remove('open')}catch(_){}
            setPhaseClasses();
            syncBadges();
          });
          setInterval(()=>{
            setPhaseClasses();
            if(prelogin()){syncBadges();return}
            const now=fingerprint();
            if(now!==fp){render();checkNew()}else syncBadges();
          },1200);"""
          if old not in s:
              raise SystemExit("notification lifecycle anchor missing")
          s=s.replace(old,new,1)
          
          replacement="""<script id="yardivo-v583-supplier-history-tombstone-voice-20260924">
          (function(){
          'use strict';
          if(window.__YARDIVO_SUPPLIER_HISTORY_TOMBSTONE_VOICE_20260924__)return;
          window.__YARDIVO_SUPPLIER_HISTORY_TOMBSTONE_VOICE_20260924__=true;
          function purgeGhostSupplier(){
           try{
             for(const st of [localStorage,sessionStorage]){
               const remove=[];
               for(let i=0;i<st.length;i++){
                 const k=st.key(i);
                 if(k&&String(k).toLowerCase().includes('dobavljac69'))remove.push(k)
               }
               remove.forEach(k=>st.removeItem(k))
             }
           }catch(_){}
           try{
             document.querySelectorAll('option,tr,li,[data-username],[data-user]').forEach(el=>{
               const txt=String(el.textContent||'').trim().toLowerCase();
               const du=String(el.getAttribute?.('data-username')||el.getAttribute?.('data-user')||'').toLowerCase();
               if(txt==='dobavljac69'||du==='dobavljac69'||txt.includes('dobavljac69'))el.remove()
             })
           }catch(_){}
          }
          document.addEventListener('DOMContentLoaded',()=>setTimeout(purgeGhostSupplier,100));
          window.addEventListener('load',()=>setTimeout(purgeGhostSupplier,250),{once:true});
          ['yardivo:login','yardivo:data-synced','yardivo:master-data-changed'].forEach(ev=>window.addEventListener(ev,()=>setTimeout(purgeGhostSupplier,40)));
          setInterval(purgeGhostSupplier,1000);
          try{new MutationObserver(()=>purgeGhostSupplier()).observe(document.documentElement,{childList:true,subtree:true})}catch(_){}
          })();
          </script>"""
          pat=r'<script id="yardivo-v583-supplier-history-tombstone-voice-20260924">.*?</script>'
          s2,n=re.subn(pat,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit("tombstone script replace failed")
          s=s2
          
          final_guard="""<script id="yardivo-v583-notification-login-ai-voice-guard-20260924">
          (()=>{'use strict';
          if(window.__YARDIVO_NOTIFICATION_LOGIN_AI_VOICE_GUARD_20260924__)return;
          window.__YARDIVO_NOTIFICATION_LOGIN_AI_VOICE_GUARD_20260924__=true;
          function stopVoice(){
           try{window.speechSynthesis?.cancel?.()}catch(_){}
           try{window.YardivoAIVoiceNotifications?.setMode?.('off')}catch(_){}
          }
          window.addEventListener('yardivo:logout',()=>{
           try{sessionStorage.setItem('yardivo_ai_voice_resume_after_login',localStorage.getItem('yardivo_notification_sound_mode_v2')==='off'?'0':'1')}catch(_){}
           stopVoice();
          });
          window.addEventListener('yardivo:login',()=>{
           try{
             const resume=sessionStorage.getItem('yardivo_ai_voice_resume_after_login');
             if(resume==='1'){
               sessionStorage.removeItem('yardivo_ai_voice_resume_after_login');
               window.YardivoAIVoiceNotifications?.setMode?.('ai')
             }
           }catch(_){}
          });
          })();
          </script>"""
          if 'yardivo-v583-notification-login-ai-voice-guard-20260924' not in s:
              s=s.replace('</body>',final_guard+'\n</body>',1)
          
          p.write_text(s,encoding="utf-8")
          Path(".github/workflows/yardivo-notif-login-voice.yml").unlink()
          
      - name: Validate JS and semantics
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s=Path("index.html").read_text(encoding="utf-8")
          assert "window.addEventListener('yardivo:login',()=>{" in s
          assert "window.addEventListener('yardivo:logout',()=>{" in s
          assert "if(prelogin()){syncBadges();return}" in s
          assert "yardivo-v583-notification-login-ai-voice-guard-20260924" in s
          m=re.search(r'<script id="yardivo-notifications-final-v5">(.*?)</script>',s,re.S)
          assert m
          Path("/tmp/notif.js").write_text(m.group(1),encoding="utf-8")
          subprocess.check_call(["node","--check","/tmp/notif.js"])
          m=re.search(r'<script id="yardivo-v583-supplier-history-tombstone-voice-20260924">(.*?)</script>',s,re.S)
          assert m and "speechSynthesis" not in m.group(1) and "pollVoice" not in m.group(1) and "yardivo_voice_notif_seen_v583" not in m.group(1)
          Path("/tmp/tomb.js").write_text(m.group(1),encoding="utf-8")
          subprocess.check_call(["node","--check","/tmp/tomb.js"])
          m=re.search(r'<script id="yardivo-v583-notification-login-ai-voice-guard-20260924">(.*?)</script>',s,re.S)
          assert m
          Path("/tmp/guard.js").write_text(m.group(1),encoding="utf-8")
          subprocess.check_call(["node","--check","/tmp/guard.js"])
          
      - name: Commit
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-notif-login-voice.yml
          git diff --cached --check
          git commit -m "Align notification popups with AI voice login lifecycle"
          git push origin HEAD:main
