name: Fix multi-tab login isolation
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-multitab-login-fix.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login session isolation
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          old="{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}"
          new="{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:window.sessionStorage}}"
          count=s.count(old)
          if count!=2:
              raise SystemExit(f"Expected 2 shared auth client configs, found {count}")
          s=s.replace(old,new)

          anchor="""async function authenticate(){
  const username=(document.getElementById('loginUser')?.value||'').trim().toLowerCase();"""
          repl="""function withLoginTimeout(promise,ms=12000,label='ONLINE BAZA'){
  let timer;
  return Promise.race([
    Promise.resolve(promise),
    new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(label+' NIJE ODGOVORILA NA VRIJEME. Pokušaj ponovno.')),ms)})
  ]).finally(()=>clearTimeout(timer))
}

async function authenticate(){
  const username=(document.getElementById('loginUser')?.value||'').trim().toLowerCase();"""
          if anchor not in s:
              raise SystemExit("Canonical login authenticate anchor missing")
          s=s.replace(anchor,repl,1)

          old_auth="""    const connected=await window.YardivoSupabase.authenticate(auth.access_token,auth.refresh_token);
    if(!connected||!window.YardivoSupabase?.online?.())throw new Error('ONLINE BAZA NIJE SPOJENA.');"""
          new_auth="""    const connected=await withLoginTimeout(
      window.YardivoSupabase.authenticate(auth.access_token,auth.refresh_token),
      12000,
      'ONLINE BAZA'
    );
    if(!connected||!window.YardivoSupabase?.online?.())throw new Error('ONLINE BAZA NIJE SPOJENA.');"""
          if old_auth not in s:
              raise SystemExit("Online authenticate anchor missing")
          s=s.replace(old_auth,new_auth,1)

          # Explicit per-tab marker, useful for diagnostics and preventing future regression.
          marker="""<script id="yardivo-v583-multitab-auth-isolation-20260924">
(function(){'use strict';
try{
  if(!sessionStorage.getItem('yardivo_tab_session_id_v583')){
    sessionStorage.setItem('yardivo_tab_session_id_v583','TAB-'+Date.now()+'-'+Math.random().toString(36).slice(2,10));
  }
}catch(_){}
window.__YARDIVO_AUTH_STORAGE_SCOPE_V583__='sessionStorage-per-tab';
})();
</script>
"""
          insert_at=s.find('</head>')
          if insert_at<0:
              raise SystemExit("head close missing")
          if 'yardivo-v583-multitab-auth-isolation-20260924' not in s:
              s=s[:insert_at]+marker+s[insert_at:]

          p.write_text(s,encoding="utf-8")

      - name: Validate login scripts
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s=Path("index.html").read_text(encoding="utf-8")
          assert s.count("storage:window.sessionStorage")>=2
          assert "withLoginTimeout" in s
          assert "ONLINE BAZA NIJE ODGOVORILA NA VRIJEME" in s
          assert "yardivo-v583-multitab-auth-isolation-20260924" in s
          for sid in ["yardivo-auth-driver-role-final-fix","yardivo-online-sync-v2-20260902","yardivo-canonical-login-router-v2-20260901","yardivo-v583-multitab-auth-isolation-20260924"]:
              m=re.search(r'<script[^>]+id="'+re.escape(sid)+r'"[^>]*>(.*?)</script>',s,re.S)
              if not m:
                  raise SystemExit("Missing script "+sid)
              q="/tmp/"+sid+".js"
              Path(q).write_text(m.group(1),encoding="utf-8")
              subprocess.check_call(["node","--check",q])
          subprocess.check_call(["git","diff","--check"])

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/yardivo-multitab-login-fix.yml
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-multitab-login-fix.yml
          git diff --cached --check
          git commit -m "Fix multi-tab login session isolation"
          git push origin HEAD:main
