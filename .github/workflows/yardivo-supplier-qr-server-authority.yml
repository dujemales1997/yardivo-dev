name: Fix supplier QR server authority
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-supplier-qr-server-authority.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Supplier QR authority
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          old="""function normalized(x){
            const q=qrMeta(x);
            return {"""
          new="""function normalized(x){
            const parsed=qrMeta(x);
            const q={
              qrUrl:String(x.gate_qr_url||parsed?.qrUrl||''),
              token:String(x.gate_qr_token||parsed?.token||''),
              issuedAt:String(x.gate_qr_issued_at||parsed?.issuedAt||'')
            };
            return {"""
          if old not in s:
              raise SystemExit("normalized QR anchor missing")
          s=s.replace(old,new,1)

          import re
          s,n=re.subn(r"qrUrl:String\(q\?\.qrUrl\|\|''\),\s*qrToken:String\(q\?\.token\|\|''\)",
                      "qrUrl:String(q.qrUrl||''),\n    qrToken:String(q.token||''),\n    qrIssuedAt:String(q.issuedAt||'')",s,count=1)
          if n!=1:
              raise SystemExit("normalized QR fields anchor missing")

          old3="""const fp=JSON.stringify(next.map(x=>[x.serverId,x.id,x.status,x.warehouse,x.date,x.time,x.dock,x.plate,x.trailer,x.driver,x.driverContact,x.pallets,x.sku,x.review,x.qrUrl,x.updatedAt]));"""
          new3="""const fp=JSON.stringify(next.map(x=>[x.serverId,x.id,x.status,x.warehouse,x.date,x.time,x.dock,x.plate,x.trailer,x.driver,x.driverContact,x.pallets,x.sku,x.review,x.qrUrl,x.qrIssuedAt,x.updatedAt]));"""
          if old3 not in s:
              raise SystemExit("fingerprint anchor missing")
          s=s.replace(old3,new3,1)

          # Update stale QR copy: QR is in Stanje najave / Isporuke, not old History surface.
          s=s.replace("QR · CHECK-IN je objavljen u Supplier Povijesti najava.","QR · CHECK-IN je objavljen u Stanje najave / Isporuke.")
          s=s.replace("QR je spreman za preuzimanje u Povijesti najava.","QR je spreman u Stanje najave / Isporuke.")

          p.write_text(s,encoding="utf-8")
          Path(".github/workflows/yardivo-supplier-qr-server-authority.yml").unlink()

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess
          s=Path("index.html").read_text(encoding="utf-8")
          assert "gate_qr_url||parsed?.qrUrl" in s
          assert "qrIssuedAt:String(q.issuedAt||'')" in s
          assert "x.qrUrl,x.qrIssuedAt,x.updatedAt" in s
          m=re.search(r'<script id="yardivo-v583-supplier-history-status-server-authority-20260923">(.*?)</script>',s,re.S)
          assert m
          Path("/tmp/supplier-authority.js").write_text(m.group(1),encoding="utf-8")
          subprocess.check_call(["node","--check","/tmp/supplier-authority.js"])
      - name: Commit
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-supplier-qr-server-authority.yml
          git diff --cached --check
          git commit -m "Use server-authoritative Supplier QR"
          git push origin HEAD:main
