name: YARDIVO inspect supplier actions
on:
  push:
    paths:
      - '.github/workflows/yardivo-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant snippets
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8", errors="replace")
          needles=[
            "function approveSupplierRequest",
            "function openPlanner",
            "function ensureModal",
            "function rejectPlanner",
            "data-v583-approve-request",
            "data-v580-plan",
            "data-v580-reject",
            "inventoryButton",
            "YardivoGateQrV583",
            "function savePlanner",
            "function sendPlanner",
            "function acceptPlanner",
            "ysrPlanner"
          ]
          for n in needles:
              print("\n"+"="*24+" "+n+" "+"="*24)
              start=0
              found=0
              while True:
                  i=s.lower().find(n.lower(), start)
                  if i<0: break
                  found+=1
                  print(f"--- match {found} @ char {i} ---")
                  print(s[max(0,i-9000):min(len(s),i+18000)])
                  start=i+len(n)
                  if found>=8: break
              if not found: print("NO MATCH")
