name: YARDIVO inspect supplier actions
on:
  push:
    paths:
      - '.github/workflows/yardivo-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact action menu
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8", errors="replace")
          needles=["PREDLOŽI DRUGI TERMIN","ODOBRI TERMIN","ysr-actions","data-a=\"revision\""]
          for n in needles:
              print("\n===== "+n+" =====")
              start=0
              for k in range(12):
                  i=s.find(n,start)
                  if i<0: break
                  print(f"--- {k+1} @ {i} ---")
                  print(s[max(0,i-3500):min(len(s),i+6500)])
                  start=i+len(n)
