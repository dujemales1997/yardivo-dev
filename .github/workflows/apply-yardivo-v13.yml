name: Apply YARDIVO v14 notification hygiene

on:
  push:
    paths:
      - ".github/workflows/apply-yardivo-v13.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch notification system to v14
        shell: python
        run: |
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          if "notification-hygiene-v14" in s:
              print("index.html already contains v14")
              raise SystemExit(0)

          def rep(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              s = s.replace(old, new, 1)

          rep(
          """function norm(v){return safe(v).trim()}
          function load(){""",
          """function norm(v){return safe(v).trim()}
          function masterRegistry(){
            try{
              const x=JSON.parse(localStorage.getItem('yardivo_master_data_registry_v583')||'{}');
              return x&&typeof x==='object'?x:{};
            }catch(e){return{}}
          }
          function normalizeDock(v){
            const raw=norm(v).toUpperCase();
            if(!raw)return'';
            const m=raw.replace(/RAMPA/g,'').replace(/^R+/,'').trim().match(/\\d+/);
            return m?String(Number(m[0])):raw;
          }
          function normalizeWarehouse(v){
            const raw=norm(v).toUpperCase();
            if(!raw)return'';
            const rows=Array.isArray(masterRegistry().warehouses)?masterRegistry().warehouses:[];
            const hit=rows.find(w=>String(w?.id||'').toUpperCase()===raw||String(w?.name||w?.code||'').toUpperCase()===raw);
            return String(hit?.id||raw).toUpperCase();
          }
          function warehouseLabel(v){
            const id=normalizeWarehouse(v);
            const rows=Array.isArray(masterRegistry().warehouses)?masterRegistry().warehouses:[];
            const hit=rows.find(w=>String(w?.id||'').toUpperCase()===id);
            return norm(hit?.name||hit?.code||id)||'—';
          }
          function load(){""",
          "notification normalizers")

          rep(
          """    warehouse:norm(a?.warehouse),
              dock:norm(a?.dock),""",
          """    warehouse:normalizeWarehouse(a?.warehouse),
              dock:normalizeDock(a?.dock),""",
          "canonical notification state")

          rep(
          """function base(s){
            return `${s.supplier||'Dobavljač'}${s.orderNumber?' · '+s.orderNumber:''} · ${s.date||'—'} ${s.time||'—'} · ${s.warehouse||'—'}${s.dock?' · R'+s.dock:''}`;
          }""",
          """function base(s){
            return `${s.supplier||'Dobavljač'}${s.orderNumber?' · '+s.orderNumber:''} · ${s.date||'—'} ${s.time||'—'} · ${warehouseLabel(s.warehouse)}${s.dock?' · R'+normalizeDock(s.dock):''}`;
          }""",
          "notification display labels")

          rep(
          """  const add=(k,label)=>{if(oldS[k]!==newS[k])changes.push({k,label,from:oldS[k],to:newS[k]})};""",
          """  const add=(k,label)=>{
              const from=oldS[k],to=newS[k];
              const same=k==='dock'
                ? normalizeDock(from)===normalizeDock(to)
                : k==='warehouse'
                  ? normalizeWarehouse(from)===normalizeWarehouse(to)
                  : from===to;
              if(!same)changes.push({k,label,from,to});
            };""",
          "semantic notification diff")

          rep(
          """  if(c.k==='status')return [`STATUS · ${s.status.toUpperCase()}`,`${base(s)} · ${c.from||'—'} → ${c.to||'—'}`];
            if(c.k==='approvalStatus')return [`NENAJAVLJENI · ODLUKA`,`${base(s)} · odobrenje ${c.from||'—'} → ${c.to||'—'}`];
            if(c.k==='date'||c.k==='time')return ['PROMJENA TERMINA',`${base(s)} · ${c.label}: ${c.from||'—'} → ${c.to||'—'}`];
            if(c.k==='warehouse'||c.k==='dock')return ['PROMJENA LOKACIJE / RAMPE',`${base(s)} · ${c.label}: ${c.from||'—'} → ${c.to||'—'}`];""",
          """  if(c.k==='status'){
              const st=norm(s.status).toLowerCase();
              if(st.includes('na rampi'))return ['VOZILO NA RAMPI',`${base(s)} · status: ${c.from||'—'} → ${c.to||'—'}`];
              if(st.includes('dvori'))return ['DOLAZAK U DVORIŠTE',`${base(s)} · status: ${c.from||'—'} → ${c.to||'—'}`];
              if(st.includes('zaprim'))return ['ROBA ZAPRIMLJENA',`${base(s)} · status: ${c.from||'—'} → ${c.to||'—'}`];
              if(st.includes('odbij'))return ['DOSTAVA ODBIJENA',`${base(s)} · status: ${c.from||'—'} → ${c.to||'—'}`];
              if(st.includes('zavr'))return ['PROCES ZAVRŠEN',`${base(s)} · status: ${c.from||'—'} → ${c.to||'—'}`];
              if(st.includes('iza'))return ['IZLAZAK VOZILA',`${base(s)} · status: ${c.from||'—'} → ${c.to||'—'}`];
              return [`STATUS NAJAVE · ${s.status.toUpperCase()}`,`${base(s)} · ${c.from||'—'} → ${c.to||'—'}`];
            }
            if(c.k==='approvalStatus')return [`NENAJAVLJENI · ODLUKA`,`${base(s)} · odobrenje ${c.from||'—'} → ${c.to||'—'}`];
            if(c.k==='date'||c.k==='time')return ['PROMJENA TERMINA',`${base(s)} · ${c.label}: ${c.from||'—'} → ${c.to||'—'}`];
            if(c.k==='warehouse')return ['PROMJENA SKLADIŠTA',`${base(s)} · Skladište: ${warehouseLabel(c.from)} → ${warehouseLabel(c.to)}`];
            if(c.k==='dock')return ['PROMJENA RAMPE',`${base(s)} · Rampa: R${normalizeDock(c.from)||'—'} → R${normalizeDock(c.to)||'—'}`];""",
          "meaningful notification titles")

          rep(
          """      const changes=diff(old,s);
                changes.forEach(c=>{
                  const [title,body]=classify(c,s);
                  push('ANNOUNCEMENT_NEWS',title,body,s,{field:c.k,from:c.from,to:c.to});
                });""",
          """      let changes=diff(old,s);

                /* One physical event = one useful notification. */
                const statusChanged=changes.some(c=>c.k==='status');
                if(statusChanged){
                  const st=norm(s.status).toLowerCase();
                  const linked=st.includes('na rampi')?'dockArrivalAt'
                    :st.includes('dvori')?'yardArrivalAt'
                    :st.includes('zaprim')?'receivedAt'
                    :st.includes('odbij')?'rejectedAt'
                    :st.includes('zavr')?'finishedAt'
                    :st.includes('iza')?'checkoutAt':'';
                  if(linked)changes=changes.filter(c=>c.k!==linked);
                }

                const take=keys=>changes.filter(c=>keys.includes(c.k));
                const drop=keys=>{changes=changes.filter(c=>!keys.includes(c.k))};

                const term=take(['date','time']);
                if(term.length===2){
                  push('ANNOUNCEMENT_NEWS','PROMJENA TERMINA',
                    `${s.supplier||'Dobavljač'} · ${warehouseLabel(s.warehouse)}${s.dock?' · R'+normalizeDock(s.dock):''} · ${old.date||'—'} ${old.time||'—'} → ${s.date||'—'} ${s.time||'—'}`,
                    s,{field:'term',from:`${old.date||''} ${old.time||''}`.trim(),to:`${s.date||''} ${s.time||''}`.trim()});
                  drop(['date','time']);
                }

                const place=take(['warehouse','dock']);
                if(place.length===2){
                  push('ANNOUNCEMENT_NEWS','PROMJENA SKLADIŠTA / RAMPE',
                    `${s.supplier||'Dobavljač'} · ${s.date||'—'} ${s.time||'—'} · ${warehouseLabel(old.warehouse)}${old.dock?' · R'+normalizeDock(old.dock):''} → ${warehouseLabel(s.warehouse)}${s.dock?' · R'+normalizeDock(s.dock):''}`,
                    s,{field:'warehouse_dock',from:`${normalizeWarehouse(old.warehouse)}|${normalizeDock(old.dock)}`,to:`${normalizeWarehouse(s.warehouse)}|${normalizeDock(s.dock)}`});
                  drop(['warehouse','dock']);
                }

                changes.forEach(c=>{
                  const [title,body]=classify(c,s);
                  push('ANNOUNCEMENT_NEWS',title,body,s,{field:c.k,from:c.from,to:c.to});
                });""",
          "notification coalescing")

          rep(
          """function filterCleared(a){return Array.isArray(a)?a.filter(afterClearCutoff):[]}""",
          """function semanticDock(v){
            const raw=String(v??'').trim().toUpperCase();
            if(!raw)return'';
            const m=raw.replace(/RAMPA/g,'').replace(/^R+/,'').trim().match(/\\d+/);
            return m?String(Number(m[0])):raw;
          }
          function semanticWarehouse(v){
            const raw=String(v??'').trim().toUpperCase();
            if(!raw)return'';
            try{
              const m=JSON.parse(localStorage.getItem('yardivo_master_data_registry_v583')||'{}');
              const rows=Array.isArray(m?.warehouses)?m.warehouses:[];
              const hit=rows.find(w=>String(w?.id||'').toUpperCase()===raw||String(w?.name||w?.code||'').toUpperCase()===raw);
              return String(hit?.id||raw).toUpperCase();
            }catch(e){return raw}
          }
          function isNotificationNoise(n){
            if(String(n?.event||'').toUpperCase()!=='ANNOUNCEMENT_NEWS')return false;
            if(n?.field==='dock')return semanticDock(n?.from)===semanticDock(n?.to);
            if(n?.field==='warehouse')return semanticWarehouse(n?.from)===semanticWarehouse(n?.to);
            return false;
          }
          function filterCleared(a){return Array.isArray(a)?a.filter(afterClearCutoff).filter(n=>!isNotificationNoise(n)):[]}""",
          "legacy notification noise filter")

          rep(
          """    'ANNOUNCEMENT','ANNOUNCEMENT_CREATED','ANNOUNCEMENT_UPDATED',""",
          """    'ANNOUNCEMENT','ANNOUNCEMENT_CREATED','ANNOUNCEMENT_UPDATED','ANNOUNCEMENT_NEWS',""",
          "notification class")

          rep(
          """${n.event?`<span class="y5-chip">${esc(n.event)}</span>`:''}""",
          """${n.event?`<span class="y5-chip">${esc(notificationClass(n)==='ANNOUNCEMENT'?'NAJAVA / TERMIN':notificationClass(n)==='OPERATIONAL'?'OPERATIVA':'OSTALO')}</span>`:''}""",
          "human notification category")

          s = s.replace("20260923-v5.8.3-supplier-bookable-warehouse-guard-v13",
                        "20260923-v5.8.3-notification-hygiene-v14")

          required = [
              "notification-hygiene-v14",
              "function normalizeDock(v)",
              "function isNotificationNoise(n)",
              "PROMJENA SKLADIŠTA",
              "PROMJENA RAMPE",
              "'ANNOUNCEMENT_UPDATED','ANNOUNCEMENT_NEWS'",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("Verification failed: " + ", ".join(missing))

          p.write_text(s, encoding="utf-8")
          print("Patched index.html to notification hygiene v14")

      - name: Validate inline JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", s, flags=re.S|re.I)
          failures = []
          checked = 0
          for i, code in enumerate(scripts, 1):
              if not code.strip() or re.search(r"type=[\"'](?:application/ld\+json|application/json)[\"']", code[:200], re.I):
                  continue
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as f:
                  f.write(code)
                  name = f.name
              r = subprocess.run(["node", "--check", name], capture_output=True, text=True)
              checked += 1
              if r.returncode:
                  failures.append((i, r.stderr[:1200]))
          print(f"node --check: {checked} inline scripts checked")
          if failures:
              for i, err in failures[:10]:
                  print(f"SCRIPT {i} FAILED\n{err}")
              sys.exit(1)

      - name: Commit updated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed."
            exit 0
          fi
          git config user.name "YARDIVO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy YARDIVO v14 notification hygiene"
          git push origin HEAD:main
