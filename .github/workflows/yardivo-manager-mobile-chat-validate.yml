name: Validate manager mobile chat
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-manager-mobile-chat-validate.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manager mobile chat JS
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess
          s=Path("manager-mobile/index.html").read_text(encoding="utf-8")
          assert "yardivo-manager-mobile-operational-chat-v1" in s
          m=re.search(r'<script id="yardivo-manager-mobile-operational-chat-v1">(.*?)</script>',s,re.S)
          assert m
          Path("/tmp/mmchat.js").write_text(m.group(1),encoding="utf-8")
          subprocess.check_call(["node","--check","/tmp/mmchat.js"])
      - name: Remove validation workflow
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/yardivo-manager-mobile-chat-validate.yml
          git commit -m "Remove manager mobile chat validation workflow"
          git push origin HEAD:main
