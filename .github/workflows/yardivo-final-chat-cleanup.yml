name: YARDIVO final chat cleanup
on:
  push:
    paths:
      - ".github/workflows/yardivo-final-chat-cleanup.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate chat runtime
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          pat=r'<script id="yardivo-v583-chat-realtime-signal-20260925">[\s\S]*?</script>\s*'
          s2,n=re.subn(pat,'',s,count=1)
          if n!=1:
              raise SystemExit(f"old chat realtime owner: expected 1, got {n}")
          s=s2

          reps=[
            ("setInterval(()=>{if(opened)loadMessages(true)},10000)",
             "setInterval(()=>{if(opened)loadMessages(true)},60000)",
             "help open fallback"),
            ("badgeTimer=setInterval(pollBadge,30000)",
             "badgeTimer=setInterval(pollBadge,120000)",
             "help badge fallback"),
            ("timer=setInterval(poll,30000)",
             "timer=setInterval(poll,120000)",
             "help admin popup fallback"),
            ("timer=setInterval(()=>{if(opened)refreshThreads(false).then(loadMessages)},10000)",
             "timer=setInterval(()=>{if(opened)refreshThreads(false).then(loadMessages)},60000)",
             "operational open fallback"),
            ("setInterval(()=>{if(!document.hidden&&!opened)refreshThreads(true)},30000)",
             "setInterval(()=>{if(!document.hidden&&!opened)refreshThreads(true)},120000)",
             "operational background fallback"),
          ]
          for old,new,label in reps:
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f"{label}: expected 1, got {n}")
              s=s.replace(old,new,1)

          p.write_text(s,encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "YARDIVO Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Consolidate chat realtime and reduce fallback polling [skip ci]"
          git push
