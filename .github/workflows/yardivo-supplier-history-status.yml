name: Fix supplier order history status
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-supplier-history-status.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch supplier history/status
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          old="""    status:statusKey(x.status),"""
          new="""    status:statusKey(x.effective_status||x.status),"""
          if old not in s: raise SystemExit("status anchor missing")
          s=s.replace(old,new,1)

          old2="""    updatedAt:String(x.updated_at||x.created_at||''),"""
          new2="""    updatedAt:String(x.announcement_updated_at||x.updated_at||x.created_at||''),"""
          if old2 not in s: raise SystemExit("updatedAt anchor missing")
          s=s.replace(old2,new2,1)

          old3="""n.textContent='Povijest se učitava izravno iz YARDIVO baze. Prikazane su sve najave poslane s ovog Supplier računa.';"""
          new3="""n.textContent='Povijest se učitava izravno iz YARDIVO baze. Ovdje su sve najave i narudžbe ovog Supplier računa, uključujući završene, s njihovim zadnjim statusom.';"""
          if old3 not in s: raise SystemExit("history note anchor missing")
          s=s.replace(old3,new3,1)

          p.write_text(s,encoding="utf-8")
          Path(".github/workflows/yardivo-supplier-history-status.yml").unlink()

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess
          s=Path("index.html").read_text(encoding="utf-8")
          assert "status:statusKey(x.effective_status||x.status)" in s
          assert "x.announcement_updated_at||x.updated_at" in s
          assert "sve najave i narudžbe ovog Supplier računa" in s
          m=re.search(r'<script id="yardivo-v583-supplier-history-status-server-authority-20260923">(.*?)</script>',s,re.S)
          assert m
          Path("/tmp/supplier-history.js").write_text(m.group(1),encoding="utf-8")
          subprocess.check_call(["node","--check","/tmp/supplier-history.js"])
      - name: Commit
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-supplier-history-status.yml
          git diff --cached --check
          git commit -m "Make supplier order history server authoritative"
          git push origin HEAD:main
