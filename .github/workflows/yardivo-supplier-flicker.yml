name: Inspect supplier flicker
on:
  push:
    paths:
      - ".github/workflows/yardivo-supplier-flicker.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect supplier live renders
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8",errors="replace")
          ids=[
            "yardivo-v583-supplier-history-status-server-authority-20260923",
            "yardivo-v560-supplier-live-sync",
            "yardivo-v549-supplier-portal",
            "yardivo-v583-supplier-inbox-stable-health-final-authority",
            "yardivo-v583-supplier-no-flicker-canonical-authority",
            "yardivo-v583-supplier-single-authority-final"
          ]
          for sid in ids:
              m=re.search(r'<script\s+id="'+re.escape(sid)+r'"[^>]*>(.*?)</script>',s,re.S|re.I)
              if m:
                  print("\n===== "+sid+" =====\n")
                  print(m.group(1)[:60000])
          for n in ["setInterval(","MutationObserver(","api?.render?.()","render();","pullSupplier()","yardivo:data-synced"]:
              print("\n===== TERM "+n+" =====")
              start=0
              for k in range(20):
                  i=s.find(n,start)
                  if i<0: break
                  chunk=s[max(0,i-3500):min(len(s),i+8000)]
                  if "Supplier" in chunk or "supplier" in chunk or "ysp" in chunk:
                      print("\n---",k+1,"@",i,"---\n",chunk)
                  start=i+len(n)
