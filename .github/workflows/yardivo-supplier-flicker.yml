name: Fix supplier UI flicker
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-supplier-flicker.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch flicker
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          # 1) Never dim history/status while background polling.
          s=s.replace(
          '''#yardivoSupplierPortal[data-ysp-server-loading="1"] [data-ysp-section="history"] #yspHistoryBody,
          #yardivoSupplierPortal[data-ysp-server-loading="1"] [data-ysp-section="status"] #yspStatusList{opacity:.58}''',
          '''#yardivoSupplierPortal[data-ysp-server-loading="1"] [data-ysp-section="history"] #yspHistoryBody,
          #yardivoSupplierPortal[data-ysp-server-loading="1"] [data-ysp-section="status"] #yspStatusList{opacity:1}''',1)

          # 2) Render server authority only when canonical server data actually changed.
          old="""let rows=[],busy=false,lastPull=0,timer=0;"""
          new="""let rows=[],busy=false,lastPull=0,timer=0,lastFingerprint='';"""
          if old not in s: raise SystemExit("authority state anchor missing")
          s=s.replace(old,new,1)

          old="""  busy=true;portal()?.setAttribute('data-ysp-server-loading','1');
            try{
              const raw=await window.YardivoSupplierLiveSync?.call?.('list_mine');
              if(Array.isArray(raw)){rows=raw.map(normalized).sort(sortRows);lastPull=Date.now();renderAll()}
              return rows
            }catch(e){
              console.error('Supplier server history/status',e);
              return rows
            }finally{busy=false;portal()?.removeAttribute('data-ysp-server-loading')}"""
          new="""  busy=true;
            try{
              const raw=await window.YardivoSupplierLiveSync?.call?.('list_mine');
              if(Array.isArray(raw)){
                const next=raw.map(normalized).sort(sortRows);
                const fp=JSON.stringify(next.map(x=>[x.serverId,x.id,x.status,x.warehouse,x.date,x.time,x.dock,x.plate,x.trailer,x.driver,x.driverContact,x.pallets,x.sku,x.review,x.qrUrl,x.updatedAt]));
                rows=next;lastPull=Date.now();
                if(fp!==lastFingerprint){lastFingerprint=fp;renderAll()}
              }
              return rows
            }catch(e){
              console.error('Supplier server history/status',e);
              return rows
            }finally{busy=false}"""
          if old not in s: raise SystemExit("authority pull anchor missing")
          s=s.replace(old,new,1)

          # 3) Old Supplier portal renderer must not overwrite history/status while server authority owns them.
          old="""    localStorage.setItem(key,JSON.stringify([...map.values()]));
              api?.render?.();"""
          new="""    localStorage.setItem(key,JSON.stringify([...map.values()]));
              const activeSupplierView=document.querySelector('#yardivoSupplierPortal [data-ysp-view].active')?.dataset?.yspView||'';
              if(!window.__YARDIVO_SUPPLIER_HISTORY_STATUS_SERVER_AUTH_20260923__||!['history','status'].includes(activeSupplierView))api?.render?.();"""
          if old not in s: raise SystemExit("legacy pull render anchor missing")
          s=s.replace(old,new,1)

          # 4) Protect history/status from generic legacy render calls after sync events.
          guard=r'''
          <script id="yardivo-v583-supplier-no-flicker-final-20260923">
          (()=>{'use strict';
          if(window.__YARDIVO_SUPPLIER_NO_FLICKER_FINAL_20260923__)return;
          window.__YARDIVO_SUPPLIER_NO_FLICKER_FINAL_20260923__=true;
          let installed=false,nativeRender=null,lastView='';
          function supplier(){try{return String((typeof currentSession!=='undefined'?currentSession:window.currentSession)?.role||'').toLowerCase()==='supplier'}catch(_){return false}}
          function view(){return document.querySelector('#yardivoSupplierPortal [data-ysp-view].active')?.dataset?.yspView||''}
          function install(){
            if(installed||!supplier()||!window.YardivoSupplierPortal?.render)return;
            nativeRender=window.YardivoSupplierPortal.render.bind(window.YardivoSupplierPortal);
            window.YardivoSupplierPortal.render=function(){
              const v=view();
              if(['history','status'].includes(v)&&window.YardivoSupplierHistoryStatusServerV583){
                window.YardivoSupplierHistoryStatusServerV583.render();
                return;
              }
              return nativeRender(...arguments);
            };
            installed=true;
          }
          function stabilize(){
            if(!supplier())return;
            const p=document.getElementById('yardivoSupplierPortal');if(!p)return;
            p.style.setProperty('visibility','visible','important');
            p.style.setProperty('opacity','1','important');
            p.querySelectorAll('[data-ysp-section]').forEach(sec=>{
              sec.style.setProperty('transition','none','important');
              sec.style.setProperty('animation','none','important');
            });
            const v=view();
            if(v!==lastView){lastView=v}
          }
          window.addEventListener('yardivo:login',()=>setTimeout(()=>{install();stabilize()},100));
          window.addEventListener('yardivo:data-synced',()=>setTimeout(stabilize,0));
          document.addEventListener('click',e=>{if(e.target.closest?.('#yardivoSupplierPortal [data-ysp-view]'))setTimeout(()=>{install();stabilize()},0)},true);
          setTimeout(()=>{install();stabilize()},300);
          window.YARDIVO_DEV_BUILD='20260923-dev-v5.8.3-supplier-no-flicker-final';
          })();
          </script>
          '''
          if 'yardivo-v583-supplier-no-flicker-final-20260923' not in s:
              idx=s.lower().rfind('</body>')
              if idx<0: raise SystemExit("body close missing")
              s=s[:idx]+guard+s[idx:]

          p.write_text(s,encoding="utf-8")
          Path(".github/workflows/yardivo-supplier-flicker.yml").unlink()

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess
          s=Path("index.html").read_text(encoding="utf-8")
          assert "lastFingerprint=''" in s
          assert "supplier-no-flicker-final-20260923" in s
          assert "opacity:1}" in s
          for sid in ["yardivo-v583-supplier-history-status-server-authority-20260923","yardivo-v583-supplier-no-flicker-final-20260923"]:
              m=re.search(r'<script id="'+re.escape(sid)+r'">(.*?)</script>',s,re.S)
              assert m,sid
              q="/tmp/"+sid+".js"
              Path(q).write_text(m.group(1),encoding="utf-8")
              subprocess.check_call(["node","--check",q])
      - name: Commit
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-supplier-flicker.yml
          git diff --cached --check
          git commit -m "Remove supplier portal flicker"
          git push origin HEAD:main
