name: Validate YARDIVO scanner hardening
on:
  push:
    paths:
      - ".github/workflows/validate-scanner-hardening.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scanner inline JS and guards
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile, sys
          p=Path("YARDIVO_SCANNER_V5.8.3_ONE_QR.html")
          s=p.read_text(encoding="utf-8")
          required=[
            'id="startupCard"',
            'id="loginCard" class="card hidden"',
            "$('startupCard').classList.add('hidden')",
            "const ok=await bootstrapSession()",
            "showLogin();",
            "yardivo-user-scope",
            "yardivo-gate-pass"
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("Missing guards: "+", ".join(missing))
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",s,re.S|re.I)
          checked=0
          for i,code in enumerate(scripts,1):
              if not code.strip() or "src=" in s[max(0,s.find("<script",0)):0]:
                  pass
              with tempfile.NamedTemporaryFile("w",suffix=".js",encoding="utf-8",delete=False) as f:
                  f.write(code); name=f.name
              r=subprocess.run(["node","--check",name],capture_output=True,text=True)
              checked+=1
              if r.returncode:
                  print(r.stderr)
                  sys.exit(1)
          print(f"PASS: {checked} inline scripts checked")
          print("PASS: scanner startup/session guards present")
