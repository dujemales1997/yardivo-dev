name: Apply supplier QR history live fix
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-supplier-qr-inspect.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch supplier QR handoff and history UI
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          old="""    const human=cleanReviewNote(row.review_note||'');
              await window.YardivoSupplierLiveSync.call('internal_update',{
                id:row.id,
                review_note:(human?human+'\\n':'')+marker(finalMeta)
              });
              pendingIssue=null;m?.classList.remove('open');
              try{await window.YardivoSupplierRequests?.load?.()}catch(_){}
              try{await window.YardivoSupplierPlannerV580?.refresh?.(true)}catch(_){}"""
          new="""    const human=cleanReviewNote(row.review_note||'');
              row.review_note=(human?human+'\\n':'')+marker(finalMeta);
              pendingIssue=null;m?.classList.remove('open');
              try{Promise.resolve(window.YardivoSupplierRequests?.load?.()).catch(()=>{})}catch(_){}
              try{Promise.resolve(window.YardivoSupplierPlannerV580?.refresh?.(true)).catch(()=>{})}catch(_){}"""
          if old not in s:
              raise SystemExit("QR confirm block not found")
          s=s.replace(old,new,1)

          marker_id="yardivo-v583-supplier-qr-history-live-20260923"
          if marker_id in s:
              raise SystemExit("Supplier QR history patch already present")

          patch=r'''
          <style id="yardivo-v583-supplier-qr-history-live-style-20260923">
          #yardivoSupplierPortal #yspHistoryBody tr[data-yv-supplier-detail]{cursor:pointer;transition:box-shadow .18s ease,background .18s ease}
          #yardivoSupplierPortal #yspHistoryBody tr.yv-qr-ready{position:relative;background:rgba(32,198,107,.07)!important;box-shadow:inset 0 0 0 1px rgba(32,198,107,.58),0 0 16px rgba(32,198,107,.20)}
          #yardivoSupplierPortal #yspHistoryBody tr.yv-qr-ready td:first-child strong{color:#20c66b!important}
          #yardivoSupplierPortal .yv-qr-new-badge{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:4px 7px;border-radius:999px;background:#0b6f3a;color:#d8ffe6;font-size:7px;font-weight:950;letter-spacing:.04em;animation:yvQrPulse 1.4s ease-in-out infinite}
          @keyframes yvQrPulse{0%,100%{box-shadow:0 0 0 0 rgba(32,198,107,.10)}50%{box-shadow:0 0 0 6px rgba(32,198,107,.20)}}
          #yardivoSupplierQrDetailV583{position:fixed;inset:0;z-index:10000450;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,8,13,.92)}
          #yardivoSupplierQrDetailV583.open{display:flex}
          #yardivoSupplierQrDetailV583 .yv-sqd-card{width:min(720px,96vw);max-height:94vh;overflow:auto;border-radius:16px;background:#fff;color:#12202a;box-shadow:0 30px 100px rgba(0,0,0,.72)}
          #yardivoSupplierQrDetailV583 .yv-sqd-head{display:flex;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid #e2e9ee}
          #yardivoSupplierQrDetailV583 .yv-sqd-head h2{margin:0;font-size:17px}.yv-sqd-head small{display:block;margin-top:4px;color:#70818d;font-size:9px}
          #yardivoSupplierQrDetailV583 .yv-sqd-close{width:36px;height:36px;border:1px solid #cfdbe2;background:#f6f9fb;border-radius:9px;cursor:pointer}
          #yardivoSupplierQrDetailV583 .yv-sqd-body{padding:18px 20px}.yv-sqd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
          #yardivoSupplierQrDetailV583 .yv-sqd-field{border:1px solid #e0e8ed;border-radius:9px;padding:10px;background:#f9fbfc}.yv-sqd-field small{display:block;color:#7b8d99;font-size:7px;font-weight:900}.yv-sqd-field strong{display:block;margin-top:4px;font-size:11px}
          #yardivoSupplierQrDetailV583 .yv-sqd-qr{margin-top:14px;padding:16px;border:1px solid #a8ddbd;border-radius:12px;background:#effbf4;text-align:center}
          #yardivoSupplierQrDetailV583 .yv-sqd-qr h3{margin:0 0 5px;color:#0b6f3a;font-size:14px}.yv-sqd-qr p{margin:0 0 12px;color:#557166;font-size:9px}
          #yardivoSupplierQrDetailV583 .yv-sqd-canvas{width:220px;height:220px;max-width:70vw;max-height:70vw;margin:0 auto 10px;background:#fff;padding:8px;display:flex;align-items:center;justify-content:center}
          #yardivoSupplierQrDetailV583 .yv-sqd-canvas canvas,#yardivoSupplierQrDetailV583 .yv-sqd-canvas img{width:100%!important;height:100%!important}
          #yardivoSupplierQrDetailV583 .yardivo-supplier-qr-actions{justify-content:center;margin-top:10px}
          @media(max-width:620px){#yardivoSupplierQrDetailV583 .yv-sqd-grid{grid-template-columns:1fr}}
          </style>
          <script id="yardivo-v583-supplier-qr-history-live-20260923">
          (function(){
          'use strict';
          if(window.__YARDIVO_SUPPLIER_QR_HISTORY_LIVE_20260923__)return;
          window.__YARDIVO_SUPPLIER_QR_HISTORY_LIVE_20260923__=true;
          let busy=false,timer=0;

          function role(){try{const s=window.currentSession||{};return String(s.app_role||s.role||'').toLowerCase().trim()}catch(_){return''}}
          function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
          function supplierKey(){try{const s=window.currentSession||{};return 'yardivo_supplier_portal_v549_'+String(s.authUserId||s.username||s.user||'supplier')}catch(_){return'yardivo_supplier_portal_v549_supplier'}}
          function rows(){try{const x=JSON.parse(localStorage.getItem(supplierKey())||'[]');return Array.isArray(x)?x:[]}catch(_){return[]}}
          function qrMeta(x){try{return window.YardivoGateQrV583?.qrMetaFromRow?.(x)||null}catch(_){return null}}
          function rowById(id){return rows().find(x=>String(x.id)===String(id))||null}
          function whName(id){try{const m=window.YardivoAppStateV583?.master?.()||JSON.parse(localStorage.getItem('yardivo_master_data_registry_v583')||'{}');return String((m.warehouses||[]).find(x=>String(x.id)===String(id))?.name||id||'—')}catch(_){return String(id||'—')}}

          function notifyOnce(x,m){
            if(!x||!m?.qrUrl)return;
            const key='yardivo_supplier_qr_live_seen_v583_'+String(x.id)+'_'+String(m.issuedAt||m.qrUrl);
            if(localStorage.getItem(key)==='1')return;
            localStorage.setItem(key,'1');
            try{
              if(typeof showYmsToast==='function')showYmsToast('success','QR ZA DOCK JE STIGAO',whName(x.warehouse)+' · otvori Povijest najava.',5200);
            }catch(_){}
            try{
              let list=window.YardivoNotifications?.load?.();
              if(!Array.isArray(list))list=[];
              list.unshift({id:'SUP-QR-LIVE-'+String(x.id)+'-'+Date.now(),event:'SUPPLIER_QR_READY',type:'success',title:'QR ZA DOCK JE STIGAO',body:whName(x.warehouse)+' · '+String(x.date||'')+' '+String(x.time||'')+' · QR je spreman za vozača.',at:new Date().toISOString(),createdAt:new Date().toISOString(),roles:['supplier'],supplierDeliveryId:String(x.id),readBy:{}});
              list=list.slice(0,300);
              window.YardivoNotifications?.save?.(list);
              window.YardivoNotifications?.render?.();
            }catch(_){}
          }

          function decorate(){
            if(role()!=='supplier')return;
            const map=new Map(rows().map(x=>[String(x.id),x]));
            document.querySelectorAll('#yspHistoryBody tr').forEach(tr=>{
              const id=String(tr.querySelector('td:first-child strong')?.textContent||'').trim();
              const x=map.get(id);if(!x)return;
              tr.dataset.yvSupplierDetail=id;
              const m=qrMeta(x);
              tr.classList.toggle('yv-qr-ready',!!m?.qrUrl);
              const first=tr.querySelector('td:first-child');
              let b=first?.querySelector('.yv-qr-new-badge');
              if(m?.qrUrl&&!b&&first){b=document.createElement('span');b.className='yv-qr-new-badge';b.innerHTML='▣ QR STIGAO';first.appendChild(document.createElement('br'));first.appendChild(b);notifyOnce(x,m)}
              if(!m?.qrUrl&&b)b.remove();
            });
          }

          function ensureModal(){
            let m=document.getElementById('yardivoSupplierQrDetailV583');if(m)return m;
            m=document.createElement('div');m.id='yardivoSupplierQrDetailV583';
            m.innerHTML='<div class="yv-sqd-card"><div class="yv-sqd-head"><div><h2>DETALJ NAJAVE</h2><small id="yvSqdSub">Supplier najava</small></div><button type="button" class="yv-sqd-close">×</button></div><div class="yv-sqd-body" id="yvSqdBody"></div></div>';
            document.body.appendChild(m);
            m.querySelector('.yv-sqd-close').onclick=()=>m.classList.remove('open');
            m.onclick=e=>{if(e.target===m)m.classList.remove('open')};
            return m;
          }

          function openDetail(id){
            const x=rowById(id);if(!x)return;
            const m=ensureModal(),meta=qrMeta(x);
            document.getElementById('yvSqdSub').textContent=String(x.id)+' · '+whName(x.warehouse);
            const qrHtml=meta?.qrUrl?'<div class="yv-sqd-qr"><h3>▣ QR ZA VOZAČA / DOCK</h3><p>Pošalji ovaj QR vozaču za ulaz i potvrdu na rampi.</p><div class="yv-sqd-canvas" id="yvSqdQrCanvas"></div>'+(window.YardivoGateQrV583?.supplierButtons?.(x)||'')+'</div>':'';
            document.getElementById('yvSqdBody').innerHTML=
              '<div class="yv-sqd-grid">'+
              '<div class="yv-sqd-field"><small>DATUM / TERMIN</small><strong>'+esc(x.date||'—')+' · '+esc(x.time||'—')+'</strong></div>'+
              '<div class="yv-sqd-field"><small>SKLADIŠTE / RAMPA</small><strong>'+esc(whName(x.warehouse))+' · '+esc(x.dock||'—')+'</strong></div>'+
              '<div class="yv-sqd-field"><small>NARUDŽBA</small><strong>'+esc(x.order||'—')+'</strong></div>'+
              '<div class="yv-sqd-field"><small>STATUS</small><strong>'+esc(x.status||'—')+'</strong></div>'+
              '<div class="yv-sqd-field"><small>PALETE / SKU</small><strong>'+Number(x.pallets||0)+' / '+Number(x.skuCount||x.sku_count||0)+'</strong></div>'+
              '<div class="yv-sqd-field"><small>VOZILO / VOZAČ</small><strong>'+esc(x.plate||'—')+' · '+esc(x.driver||'—')+'</strong></div>'+
              '</div>'+qrHtml;
            m.classList.add('open');
            if(meta?.qrUrl){
              setTimeout(()=>{
                const el=document.getElementById('yvSqdQrCanvas');if(!el)return;
                try{if(window.QRCode){el.innerHTML='';new QRCode(el,{text:meta.qrUrl,width:420,height:420,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}}catch(_){}
              },0);
            }
          }

          async function refreshNow(){
            if(role()!=='supplier'||busy||document.hidden)return;
            busy=true;
            try{
              await window.YardivoSupplierLiveSync?.pullSupplier?.();
              try{window.YardivoSupplierPortal?.render?.()}catch(_){}
              decorate();
            }catch(_){}
            finally{busy=false}
          }

          document.addEventListener('click',e=>{
            const tr=e.target.closest?.('#yspHistoryBody tr[data-yv-supplier-detail]');
            if(tr&&!e.target.closest('button,a,input,select,textarea')){e.preventDefault();openDetail(tr.dataset.yvSupplierDetail)}
          },true);

          ['yardivo:login','yardivo:supplier-qr-ready','yardivo:supplier-request-updated'].forEach(ev=>window.addEventListener(ev,()=>setTimeout(()=>{decorate();if(ev==='yardivo:login')refreshNow()},80)));
          window.addEventListener('focus',refreshNow);
          document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshNow()});
          const mo=new MutationObserver(()=>{clearTimeout(window.__yvQrDecorate);window.__yvQrDecorate=setTimeout(decorate,60)});
          try{mo.observe(document.getElementById('yardivoSupplierPortal')||document.body,{childList:true,subtree:true})}catch(_){}
          timer=setInterval(refreshNow,1500);
          setTimeout(()=>{decorate();refreshNow()},500);
          window.YARDIVO_DEV_BUILD='20260923-dev-v5.8.3-supplier-qr-live-history';
          })();
          </script>
          '''
          if '</body>' not in s:
              raise SystemExit("body close not found")
          s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding="utf-8")

          start=s.index('<script id="'+marker_id+'">')+len('<script id="'+marker_id+'">')
          end=s.index('</script>',start)
          Path('/tmp/qr_live.js').write_text(s[start:end],encoding='utf-8')
      - name: Validate
        run: |
          node --check /tmp/qr_live.js
          grep -q "QR ZA DOCK JE STIGAO" index.html
          grep -q "yardivo-v583-supplier-qr-history-live-20260923" index.html
          git diff --check
      - name: Commit and clean temporary workflow
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/yardivo-supplier-qr-inspect.yml
          git add index.html
          git commit -m "Add live supplier QR history and faster handoff"
          git push origin HEAD:main
