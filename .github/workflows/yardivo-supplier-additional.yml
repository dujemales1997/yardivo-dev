name: Supplier additional data button
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-supplier-additional.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch supplier status cards
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          # 1) Remove yellow review-note block from supplier status cards.
          old="""      '</div>'+(x.review?'<div class="ysps-review" style="margin-top:10px">YARDIVO: '+esc(x.review)+'</div>':'')+'</div>'+"""
          new="""      '</div><div class="ysps-card-actions"><button type="button" class="btn-secondary ysps-additional-btn" data-yv-supplier-additional="'+esc(x.id)+'">UNESI DODATNO</button></div></div>'+"""
          if old not in s:
              raise SystemExit("Supplier review render anchor not found")
          s=s.replace(old,new,1)

          # 2) Add modal styles next to existing supplier edit styles.
          style_anchor="""#yardivoSupplierPortal .ysps-terminal-note{margin-top:10px;padding:9px 10px;border:1px solid #334b5b;border-radius:8px;background:#0a1720;color:#748b9b;font-size:9px}"""
          style_new="""#yardivoSupplierPortal .ysps-card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
          #yardivoSupplierPortal .ysps-additional-btn{min-height:38px;padding:8px 13px;font-size:9px;font-weight:950}
          #yardivoSupplierAdditionalModalV583{position:fixed;inset:0;z-index:2147482700;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,8,13,.86);backdrop-filter:blur(4px)}
          #yardivoSupplierAdditionalModalV583.open{display:flex}
          #yardivoSupplierAdditionalModalV583 .ysam-card{width:min(620px,96vw);border:1px solid #31576e;border-radius:16px;background:#0a1d29;color:#eef8fd;box-shadow:0 28px 90px rgba(0,0,0,.58);overflow:hidden}
          #yardivoSupplierAdditionalModalV583 .ysam-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 16px;border-bottom:1px solid #27485c;background:#0d2432}
          #yardivoSupplierAdditionalModalV583 .ysam-head h3{margin:0;font-size:14px}#yardivoSupplierAdditionalModalV583 .ysam-head small{display:block;margin-top:4px;color:#7f9daf;font-size:8px}
          #yardivoSupplierAdditionalModalV583 .ysam-close{width:34px;height:34px;border:1px solid #31566b;border-radius:8px;background:#102b3a;color:#fff;font-size:19px;font-weight:950;cursor:pointer}
          #yardivoSupplierAdditionalModalV583 .ysam-body{padding:15px 16px}
          #yardivoSupplierAdditionalModalV583 .ysam-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
          #yardivoSupplierAdditionalModalV583 label{display:grid;gap:5px;color:#86a2b3;font-size:8px;font-weight:900}
          #yardivoSupplierAdditionalModalV583 input{width:100%;box-sizing:border-box;background:#06131d;color:#eef8fd;border:1px solid #294a60;border-radius:8px;padding:10px 11px;font-size:10px}
          #yardivoSupplierAdditionalModalV583 .ysam-note{margin-top:10px;color:#7895a7;font-size:8px;line-height:1.5}
          #yardivoSupplierAdditionalModalV583 .ysam-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid #27485c;background:#081923}
          #yardivoSupplierAdditionalModalV583 .ysam-actions button{min-height:39px;padding:8px 13px;font-weight:950}
          @media(max-width:650px){#yardivoSupplierAdditionalModalV583 .ysam-grid{grid-template-columns:1fr}}
          #yardivoSupplierPortal .ysps-terminal-note{margin-top:10px;padding:9px 10px;border:1px solid #334b5b;border-radius:8px;background:#0a1720;color:#748b9b;font-size:9px}"""
          if style_anchor not in s:
              raise SystemExit("Supplier style anchor not found")
          s=s.replace(style_anchor,style_new,1)

          # 3) Add modal helpers before existing saveVehicleFromCard.
          fn_anchor="""async function saveVehicleFromCard(id,btn){"""
          helper="""function ensureSupplierAdditionalModal(){
            let m=document.getElementById('yardivoSupplierAdditionalModalV583');if(m)return m;
            m=document.createElement('div');m.id='yardivoSupplierAdditionalModalV583';
            m.innerHTML='<div class="ysam-card"><div class="ysam-head"><div><h3>UNESI DODATNO</h3><small id="ysamRef">YARDIVO najava</small></div><button type="button" class="ysam-close" data-ysam-close>×</button></div><div class="ysam-body"><div class="ysam-grid"><label>REGISTRACIJA VOZILA<input id="ysamPlate" autocomplete="off" placeholder="npr. ST-1234"></label><label>REGISTRACIJA PRIKOLICE<input id="ysamTrailer" autocomplete="off" placeholder="opcionalno"></label><label>IME I PREZIME VOZAČA<input id="ysamDriver" autocomplete="off" placeholder="ime vozača"></label><label>KONTAKT VOZAČA<input id="ysamContact" autocomplete="off" placeholder="mobitel"></label></div><div class="ysam-note">Podaci se spremaju direktno u istu YARDIVO najavu i koriste ih Gate, Prijam i operativni status.</div></div><div class="ysam-actions"><button type="button" class="btn-secondary" data-ysam-close>ODUSTANI</button><button type="button" class="btn-primary" data-ysam-save>SPREMI PODATKE</button></div></div>';
            document.body.appendChild(m);
            m.querySelectorAll('[data-ysam-close]').forEach(b=>b.onclick=()=>m.classList.remove('open'));
            m.onclick=e=>{if(e.target===m)m.classList.remove('open')};
            m.querySelector('[data-ysam-save]').onclick=()=>saveSupplierAdditionalModal();
            return m
          }
          function openSupplierAdditional(id){
            const x=rowByRawId(id);if(!x)return;
            const m=ensureSupplierAdditionalModal();m.dataset.rowId=String(x.id);
            m.querySelector('#ysamRef').textContent=(window.YardivoAnnouncementNumberV583?.displayId?.(x.id)||x.id)+' · '+(x.order||'BEZ PO');
            m.querySelector('#ysamPlate').value=x.plate||'';
            m.querySelector('#ysamTrailer').value=x.trailer||'';
            m.querySelector('#ysamDriver').value=x.driver||'';
            m.querySelector('#ysamContact').value=x.driverContact||'';
            m.classList.add('open');
            setTimeout(()=>m.querySelector('#ysamPlate')?.focus(),40)
          }
          async function saveSupplierAdditionalModal(){
            const m=ensureSupplierAdditionalModal(),x=rowByRawId(m.dataset.rowId);if(!x)return;
            const btn=m.querySelector('[data-ysam-save]'),old=btn.textContent;
            const payload={client_id:String(x.id),vehicle_plate:String(m.querySelector('#ysamPlate').value||'').trim().toUpperCase(),trailer_plate:String(m.querySelector('#ysamTrailer').value||'').trim().toUpperCase(),driver_name:String(m.querySelector('#ysamDriver').value||'').trim(),driver_contact:String(m.querySelector('#ysamContact').value||'').trim()};
            btn.disabled=true;btn.textContent='SPREMAM…';
            try{
              await window.YardivoSupplierLiveSync?.call?.('vehicle',payload);
              m.classList.remove('open');
              await pull(true);
              try{window.showYmsToast?.('success','PODACI SPREMLJENI','Vozilo i vozač su povezani s YARDIVO najavom.')}catch(_){}
            }catch(err){
              alert('Spremanje podataka nije uspjelo:\\n'+String(err?.message||err))
            }finally{btn.disabled=false;btn.textContent=old}
          }
          async function saveVehicleFromCard(id,btn){"""
          if fn_anchor not in s:
              raise SystemExit("saveVehicleFromCard anchor not found")
          s=s.replace(fn_anchor,helper,1)

          # 4) Wire button into the existing delegated click handler.
          click_anchor="""document.addEventListener('click',e=>{
            const save=e.target.closest?.('[data-yv-supplier-save-vehicle]');"""
          click_new="""document.addEventListener('click',e=>{
            const additional=e.target.closest?.('[data-yv-supplier-additional]');
            if(additional){e.preventDefault();e.stopPropagation();openSupplierAdditional(additional.dataset.yvSupplierAdditional);return}
            const save=e.target.closest?.('[data-yv-supplier-save-vehicle]');"""
          if click_anchor not in s:
              raise SystemExit("Supplier click handler anchor not found")
          s=s.replace(click_anchor,click_new,1)

          p.write_text(s,encoding="utf-8")
          Path(".github/workflows/yardivo-supplier-additional.yml").unlink()

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess
          s=Path("index.html").read_text(encoding="utf-8")
          assert 'data-yv-supplier-additional' in s
          assert 'yardivoSupplierAdditionalModalV583' in s
          assert 'UNESI DODATNO' in s
          assert "window.YardivoSupplierLiveSync?.call?.('vehicle',payload)" in s
          assert """(x.review?'<div class="ysps-review" style="margin-top:10px">YARDIVO: '""" not in s
          m=re.search(r'<script id="yardivo-v583-supplier-history-status-server-authority-20260923">(.*?)</script>',s,re.S)
          assert m
          Path("/tmp/supplier-authority.js").write_text(m.group(1),encoding="utf-8")
          subprocess.check_call(["node","--check","/tmp/supplier-authority.js"])
      - name: Commit
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-supplier-additional.yml
          git diff --cached --check
          git commit -m "Add supplier additional delivery data action"
          git push origin HEAD:main
