name: Fix admin settings flicker
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-admin-flicker-inspect.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch user accounts stable rendering
        shell: python
        run: |
          from pathlib import Path
          import subprocess, re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          old="async function renderUsers(){if(!isAdmin())return;const wrap=$('yardivoAccountAdminRestoredV583');if(!wrap)return;let host=$('yardivoAccountsPrettyV583');if(!host){host=document.createElement('div');host.id='yardivoAccountsPrettyV583';wrap.appendChild(host)}host.innerHTML='<div class=\"yv-users-empty\">Učitavam korisnike…</div>';try{let rows=await adminInvoke('list');if(!Array.isArray(rows))rows=rows?.data||[];"
          new="let yvUsersRenderBusy=false,yvUsersLastAt=0;async function renderUsers(force=false){if(!isAdmin())return;const wrap=$('yardivoAccountAdminRestoredV583');if(!wrap)return;let host=$('yardivoAccountsPrettyV583');if(!host){host=document.createElement('div');host.id='yardivoAccountsPrettyV583';wrap.appendChild(host)}if(yvUsersRenderBusy)return;const hadContent=!!host.querySelector('.yv-users-toolbar,.yv-user-row');if(!hadContent)host.innerHTML='<div class=\"yv-users-empty\">Učitavam korisnike…</div>';yvUsersRenderBusy=true;try{let rows=await adminInvoke('list');if(!Array.isArray(rows))rows=rows?.data||[];const fp=JSON.stringify(rows.map(u=>[u.auth_user_id,u.username,u.app_role,u.active,u.location,u.contact_email,u.auth_orphan]));if(!force&&host.dataset.yvUsersFingerprint===fp)return;host.dataset.yvUsersFingerprint=fp;"
          if old not in s:
              raise SystemExit("renderUsers start anchor missing")
          s=s.replace(old,new,1)

          old_end="}catch(e){host.innerHTML='<div class=\"yv-users-empty\">Greška pri učitavanju korisnika: '+esc(e?.message||e)+'</div>'}}\nfunction enhanceAccounts(){if(!isAdmin())return;const b=$('yardivoAddUserRestoredBtnV583');if(b){b.textContent='＋ DODAJ KORISNIKA';b.onclick=e=>{e.preventDefault();e.stopPropagation();window.YardivoAdminUserCreationV583?.open?.()}}renderUsers()}"
          new_end="}catch(e){if(!hadContent)host.innerHTML='<div class=\"yv-users-empty\">Greška pri učitavanju korisnika: '+esc(e?.message||e)+'</div>';else console.warn('[YARDIVO USERS REFRESH]',e)}finally{yvUsersRenderBusy=false;yvUsersLastAt=Date.now()}}\nfunction enhanceAccounts(){if(!isAdmin())return;const b=$('yardivoAddUserRestoredBtnV583');if(b){b.textContent='＋ DODAJ KORISNIKA';b.onclick=e=>{e.preventDefault();e.stopPropagation();window.YardivoAdminUserCreationV583?.open?.()}}const host=$('yardivoAccountsPrettyV583');if(!host||!host.querySelector('.yv-users-toolbar,.yv-user-row')||Date.now()-yvUsersLastAt>5000)renderUsers()}"
          if old_end not in s:
              raise SystemExit("renderUsers end anchor missing")
          s=s.replace(old_end,new_end,1)

          marker='</style>\n<script id="yardivo-v583-home13-master-scope-users-ui-hotfix-js">'
          css='''\n/* Admin Settings / User Accounts: stable server-authoritative surface, no flicker. */\n#yardivoUnifiedSettingsV583 #yardivoAccountAdminRestoredV583,\n#yardivoAccountAdminRestoredV583 #yardivoAccountsPrettyV583{\n display:block!important;visibility:visible!important;opacity:1!important;\n transition:none!important;animation:none!important\n}\n#yardivoAccountAdminRestoredV583 .yv-user-row,\n#yardivoAccountAdminRestoredV583 .yv-users-toolbar{transition:none!important;animation:none!important}\n'''
          if marker not in s:
              raise SystemExit("css marker missing")
          s=s.replace(marker,css+marker,1)

          Path(".github/workflows/yardivo-admin-flicker-inspect.yml").unlink()
          p.write_text(s,encoding="utf-8")

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s=Path("index.html").read_text(encoding="utf-8")
          assert "yvUsersRenderBusy" in s
          assert "yvUsersFingerprint" in s
          assert "Date.now()-yvUsersLastAt>5000" in s
          assert "Admin Settings / User Accounts: stable server-authoritative surface" in s
          m=re.search(r'<script[^>]+id="yardivo-v583-master-supplier-responsible-users-ui-final"[^>]*>(.*?)</script>',s,re.S)
          if not m:
              # Script id changed in some builds: validate containing renderUsers block.
              pos=s.find("let yvUsersRenderBusy=false")
              a=s.rfind("<script",0,pos); b=s.find("</script>",pos)
              if a<0 or b<0: raise SystemExit("patched script not found")
              code=s[s.find(">",a)+1:b]
          else:
              code=m.group(1)
          Path("/tmp/users.js").write_text(code,encoding="utf-8")
          subprocess.check_call(["node","--check","/tmp/users.js"])
      - name: Commit
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-admin-flicker-inspect.yml
          git diff --cached --check
          git commit -m "Stop admin user accounts rendering flicker"
          git push origin HEAD:main
