name: Inspect copy selection
on:
  push:
    paths:
      - ".github/workflows/yardivo-copy-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect copy blockers
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8",errors="replace")
          for n in ["user-select:none","user-select: none","webkit-user-select","oncopy","preventDefault()","SERVER NIJE ODGOVORIO"]:
              print("\n===== "+n+" =====")
              start=0
              for k in range(20):
                  i=s.lower().find(n.lower(),start)
                  if i<0: break
                  print(f"--- {k+1} @ {i} ---")
                  print(s[max(0,i-2500):min(len(s),i+6000)])
                  start=i+len(n)
