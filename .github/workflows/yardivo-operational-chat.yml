name: Apply operational chat UI
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-operational-chat.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write block
        shell: bash
        run: |
          cat > /tmp/opchat-block.html <<'YARDIVO_CHAT_BLOCK'
<style id="yardivo-v583-operational-chat-style">
#yardivoOpChatFab{position:fixed;right:18px;bottom:76px;z-index:2147481200;display:none;align-items:center;gap:7px;border:1px solid #39769a;border-radius:12px;background:#0c2637;color:#eaf7fd;padding:10px 12px;font:900 10px/1 Arial,sans-serif;box-shadow:0 14px 38px rgba(0,0,0,.35);cursor:pointer}
#yardivoOpChatFab .yoc-badge{display:none;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#ed4b57;color:#fff;align-items:center;justify-content:center}
#yardivoOpChatPanel{position:fixed;right:16px;top:78px;z-index:2147482500;width:min(430px,calc(100vw - 32px));height:min(690px,calc(100vh - 96px));display:none;grid-template-rows:auto auto 1fr auto;border:1px solid #31586e;border-radius:16px;background:#0a1d29;color:#eef8fd;box-shadow:0 24px 80px rgba(0,0,0,.48);overflow:hidden}
#yardivoOpChatPanel.open{display:grid}.yoc-head{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid #27485c;background:#0d2432}.yoc-close{margin-left:auto;width:32px;height:32px;border:1px solid #31566b;border-radius:8px;background:#102b3a;color:#fff;font-size:18px}
.yoc-tabs{display:flex;gap:6px;overflow:auto;padding:9px;border-bottom:1px solid #244457;background:#081923}.yoc-tabs button{white-space:nowrap;border:1px solid #294c61;border-radius:9px;background:#0d2533;color:#9eb7c5;padding:8px 9px;font-size:8px;font-weight:950}.yoc-tabs button.active{background:#174867;border-color:#3b8dbb;color:#fff}.yoc-tabs em{font-style:normal;margin-left:4px;background:#e84b57;color:#fff;border-radius:8px;padding:1px 5px}
.yoc-msgs{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.yoc-empty{margin:auto;color:#718d9d;font-size:10px;text-align:center;padding:25px}.yoc-msg{max-width:86%;padding:9px 10px;border:1px solid #294b5e;border-radius:12px;background:#102837;align-self:flex-start}.yoc-msg.mine{align-self:flex-end;background:#164565;border-color:#317ba7}.yoc-msg .who{font-size:7px;color:#77a1b7;margin-bottom:4px;font-weight:900}.yoc-msg .body{font-size:10px;line-height:1.45;white-space:pre-wrap}.yoc-msg .at{margin-top:4px;color:#64879a;font-size:7px;text-align:right}
.yoc-compose{display:grid;grid-template-columns:1fr auto;gap:7px;padding:10px;border-top:1px solid #27485c;background:#0d2432}.yoc-compose textarea{resize:none;min-height:44px;max-height:90px;border:1px solid #31566c;border-radius:9px;background:#071822;color:#fff;padding:9px;font-size:10px}.yoc-compose button{border:1px solid #3691c4;border-radius:9px;background:#147bb5;color:#fff;padding:0 13px;font-weight:950}
#yardivoOpChatPopupStack{position:fixed;right:14px;top:88px;z-index:2147482450;width:min(340px,calc(100vw - 28px));display:grid;gap:8px;pointer-events:none}.yoc-pop{pointer-events:auto;border:1px solid #39708d;border-radius:12px;background:#0c2433;color:#eef8fd;padding:11px 12px;box-shadow:0 14px 36px rgba(0,0,0,.38);cursor:pointer;animation:yocIn .18s ease-out}.yoc-pop strong{display:block;font-size:10px}.yoc-pop small{display:block;margin-top:3px;color:#78a0b5;font-size:7px;font-weight:900}.yoc-pop p{margin:6px 0 0;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@keyframes yocIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@media(max-width:650px){#yardivoOpChatPanel{right:0;top:0;width:100vw;height:100dvh;border-radius:0}}
</style>
<script id="yardivo-v583-operational-chat">
(()=>{'use strict';if(window.__YARDIVO_OPERATIONAL_CHAT_V583__)return;window.__YARDIVO_OPERATIONAL_CHAT_V583__=true;
let threads=[],selected='',messages=[],opened=false,timer=null,lastPopupSig='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const role=()=>{let r=String(window.currentSession?.app_role||window.currentSession?.role||document.body?.dataset?.yardivoRole||'').toLowerCase();if(r==='voditelj'||r==='management')r='manager';if(r==='zalihe')r='inventory';if(r==='prijam')r='reception';return r};
const allowed=()=>['supplier','inventory','reception','manager'].includes(role());
async function invoke(action,payload={}){const c=await window.YardivoAuth?.client?.();if(!c)throw new Error('Auth nije spreman');const {data,error}=await c.functions.invoke('yardivo-operational-chat',{body:{action,...payload}});if(error)throw error;if(data?.ok===false)throw new Error(data.error||'Chat greška');return data?.data??data}
async function gate(action,payload={}){const c=await window.YardivoAuth?.client?.();if(!c)throw new Error('Auth nije spreman');const {data,error}=await c.functions.invoke('yardivo-self-gate',{body:{action,...payload}});if(error)throw error;if(data?.ok===false)throw new Error(data.error||'Gate chat greška');return data}
function wh(){return String(document.getElementById('globalWarehouse')?.value||window.activeWarehouse||'').trim()}
function ensure(){let f=document.getElementById('yardivoOpChatFab');if(!f){f=document.createElement('button');f.id='yardivoOpChatFab';f.type='button';f.innerHTML='💬 OPERATIVNI CHAT <span class="yoc-badge">0</span>';f.onclick=()=>openPanel();document.body.appendChild(f)}f.style.display=allowed()?'flex':'none';if(!document.getElementById('yardivoOpChatPanel')){const p=document.createElement('section');p.id='yardivoOpChatPanel';p.innerHTML='<div class="yoc-head"><div><strong>OPERATIVNI CHAT</strong><small>YARDIVO · LIVE</small></div><button type="button" class="yoc-close">×</button></div><div class="yoc-tabs" id="yocTabs"></div><div class="yoc-msgs" id="yocMsgs"><div class="yoc-empty">Odaberi razgovor.</div></div><div class="yoc-compose"><textarea id="yocInput" maxlength="2000" placeholder="Napiši poruku…"></textarea><button type="button" id="yocSend">POŠALJI</button></div>';document.body.appendChild(p);p.querySelector('.yoc-close').onclick=closePanel;p.querySelector('#yocSend').onclick=send;p.querySelector('#yocInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});p.querySelector('#yocTabs').onclick=e=>{const b=e.target.closest('[data-yoc-thread]');if(b){selected=b.dataset.yocThread;renderTabs();loadMessages()}}}if(!document.getElementById('yardivoOpChatPopupStack')){const h=document.createElement('div');h.id='yardivoOpChatPopupStack';document.body.appendChild(h)}}
function renderTabs(){const h=document.getElementById('yocTabs');if(!h)return;h.innerHTML=threads.map(t=>'<button type="button" class="'+(t.thread_key===selected?'active':'')+'" data-yoc-thread="'+esc(t.thread_key)+'">'+esc(t.label||t.thread_key)+(Number(t.unread||0)?'<em>'+Number(t.unread)+'</em>':'')+'</button>').join('')}
function fmt(v){try{return new Intl.DateTimeFormat('hr-HR',{hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch(_){return''}}
function renderMessages(){const h=document.getElementById('yocMsgs');if(!h)return;if(!selected){h.innerHTML='<div class="yoc-empty">Odaberi razgovor.</div>';return}const mine=String(window.currentSession?.username||window.currentSession?.user||'').toLowerCase();if(!messages.length){h.innerHTML='<div class="yoc-empty">Još nema poruka.</div>';return}h.innerHTML=messages.map(m=>{const im=String(m.sender_username||m.actor_name||'').toLowerCase()===mine;return '<div class="yoc-msg '+(im?'mine':'')+'"><div class="who">'+esc(im?'TI':m.sender_username||m.actor_name||'')+'</div><div class="body">'+esc(m.body||m.message||'')+'</div><div class="at">'+esc(fmt(m.created_at))+'</div></div>'}).join('');h.scrollTop=h.scrollHeight}
async function driverThreads(){if(role()!=='reception')return[];try{const d=await gate('list_reception_chats');return (d.rows||[]).map(x=>{const ev=(x.events||[])[0],ld=(x.events||[]).find(e=>e.actor_role==='driver'),seen=localStorage.getItem('yardivo_driver_chat_seen_'+x.id)||'';return {thread_key:'driver:'+x.id,label:'VOZAČ · '+String(x.vehicle_plate||x.driver_name||'KAMION'),driver:true,row:x,last_message:ev?.message||'',last_at:ev?.created_at||x.updated_at,unread:ld&&String(ld.id)!==seen?1:0}})}catch(_){return[]}}
async function refreshThreads(showPop=true){if(!allowed())return;ensure();try{const base=await invoke('list_threads')||[],drivers=await driverThreads();threads=[...base,...drivers].sort((a,b)=>String(b.last_at||'').localeCompare(String(a.last_at||'')));if(!selected&&threads[0])selected=threads[0].thread_key;renderTabs();const total=threads.reduce((s,x)=>s+Number(x.unread||0),0),b=document.querySelector('#yardivoOpChatFab .yoc-badge');if(b){b.textContent=String(total);b.style.display=total?'inline-flex':'none'}if(showPop&&!opened){const unread=threads.filter(x=>Number(x.unread||0)>0),sig=unread.map(x=>x.thread_key+':'+x.last_at).join('|');if(sig&&sig!==lastPopupSig){lastPopupSig=sig;document.getElementById('yardivoOpChatPopupStack').innerHTML=unread.slice(0,3).map(x=>'<button class="yoc-pop" data-yoc-pop="'+esc(x.thread_key)+'"><strong>'+esc(x.label)+'</strong><small>NOVA PORUKA</small><p>'+esc(x.last_message||'')+'</p></button>').join('')}}}catch(e){console.warn('[Operational Chat]',e)}}
async function loadMessages(){const t=threads.find(x=>x.thread_key===selected);if(!t)return renderMessages();try{if(t.driver){messages=(t.row?.events||[]).slice().reverse();const ld=(t.row?.events||[]).find(e=>e.actor_role==='driver');if(ld)localStorage.setItem('yardivo_driver_chat_seen_'+t.row.id,String(ld.id))}else messages=await invoke('list_messages',{thread_key:selected})||[];renderMessages();await refreshThreads(false)}catch(e){document.getElementById('yocMsgs').innerHTML='<div class="yoc-empty">'+esc(e?.message||e)+'</div>'}}
async function send(){const i=document.getElementById('yocInput'),body=String(i?.value||'').trim();if(!body||!selected)return;const t=threads.find(x=>x.thread_key===selected);try{if(t?.driver)await gate('reception_send',{id:t.row.id,message:body});else await invoke('send',{thread_key:selected,body,warehouse:wh()});i.value='';await refreshThreads(false);if(t?.driver){const d=await driverThreads();const n=d.find(x=>x.thread_key===selected);if(n)t.row=n.row}await loadMessages()}catch(e){alert('Poruka nije poslana: '+(e?.message||e))}}
async function openPanel(key){ensure();opened=true;document.getElementById('yardivoOpChatPanel').classList.add('open');document.getElementById('yardivoOpChatPopupStack').innerHTML='';await refreshThreads(false);if(key)selected=key;renderTabs();await loadMessages();clearInterval(timer);timer=setInterval(()=>{if(opened)refreshThreads(false).then(loadMessages)},3000)}
function closePanel(){opened=false;document.getElementById('yardivoOpChatPanel')?.classList.remove('open');clearInterval(timer);timer=null}
document.addEventListener('click',e=>{const b=e.target.closest?.('[data-yoc-pop]');if(b){e.preventDefault();openPanel(b.dataset.yocPop)}},true);
['yardivo:login','yardivo:online-ready'].forEach(ev=>window.addEventListener(ev,()=>setTimeout(()=>{ensure();refreshThreads()},1000)));
setTimeout(()=>{ensure();refreshThreads();setInterval(()=>{if(!document.hidden&&!opened)refreshThreads(true)},4000)},2200);
window.YardivoOperationalChatV583={open:openPanel,close:closePanel,refresh:refreshThreads};})();
</script>
YARDIVO_CHAT_BLOCK
      - name: Patch and validate
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          block=Path('/tmp/opchat-block.html').read_text(encoding='utf-8')
          if 'yardivo-v583-operational-chat' not in s:
              i=s.lower().rfind('</body>')
              if i<0: raise SystemExit('body close missing')
              s=s[:i]+block+'\n'+s[i:]
              p.write_text(s,encoding='utf-8')
          m=re.search(r'<script id="yardivo-v583-operational-chat">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/opchat.js').write_text(m.group(1),encoding='utf-8')
          subprocess.check_call(['node','--check','/tmp/opchat.js'])
          Path('.github/workflows/yardivo-operational-chat.yml').unlink()
      - name: Commit
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-operational-chat.yml
          git diff --cached --check
          git commit -m "Add operational chat popups"
          git push origin HEAD:main
