name: Inspect supplier portal
on:
  push:
    paths:
      - ".github/workflows/yardivo-supplier-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact supplier shell
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8",errors="replace")
          for n in ["ONLINE BAZA · PONOVNO SPAJANJE","ONLINE BAZA","yardivoOnlineStatus","online-status","yardivoSupplierPortal","yspHistoryBody","yspStatusList","yardivoSupplierRightDailyMapV583"]:
              start=0
              for k in range(8):
                  i=s.lower().find(n.lower(),start)
                  if i<0: break
                  print(f"\n===== {n} #{k+1} @ {i} =====\n")
                  print(s[max(0,i-5500):min(len(s),i+12000)])
                  start=i+len(n)
