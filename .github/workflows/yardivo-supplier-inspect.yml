name: Inspect supplier portal
on:
  push:
    paths:
      - ".github/workflows/yardivo-supplier-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect supplier scripts
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8",errors="replace")
          for m in re.finditer(r'<script(?:\s+id="([^"]+)")?[^>]*>(.*?)</script>',s,re.S|re.I):
              sid=m.group(1) or ''
              body=m.group(2)
              low=(sid+' '+body).lower()
              if 'supplier' in low and any(k in low for k in ['portal','history','delivery','notification','side','status']):
                  print("\n===== SCRIPT",sid,"@ ",m.start(),"=====\n")
                  print(body[:52000])
          print("\n===== SUPPLIER STYLE BLOCKS =====\n")
          for m in re.finditer(r'<style(?:\s+id="([^"]+)")?[^>]*>(.*?)</style>',s,re.S|re.I):
              sid=m.group(1) or ''
              body=m.group(2)
              if 'supplier' in (sid+' '+body).lower():
                  print("\n--- STYLE",sid,"@ ",m.start(),"---\n")
                  print(body[:22000])
