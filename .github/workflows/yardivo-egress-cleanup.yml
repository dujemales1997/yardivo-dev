name: YARDIVO egress cleanup
on:
  push:
    paths:
      - ".github/workflows/yardivo-egress-cleanup.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact egress cleanup
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          changes=[]
          def rep(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              s=s.replace(old,new)
              changes.append(label)

          rep("""window.__yardivoFastSafetySyncTimer=setInterval(()=>{
            if(!ready||document.hidden||navigator.onLine===false)return;
            if(pending())flush();
            else pull();
          },2200);""","""window.__yardivoFastSafetySyncTimer=setInterval(()=>{
            if(!ready||document.hidden||navigator.onLine===false)return;
            if(pending()){flush();return}
            /* Realtime is authoritative while connected. Do not download a full bootstrap
               every few seconds when no server-side change happened. */
            if(realtimeStatus==='SUBSCRIBED')return;
            pull();
          },60000);""","main sync safety 2.2s -> realtime/60s fallback")

          rep("safetyPulseMs:2200,","safetyPulseMs:60000,","sync status pulse")

          rep("""window.__yardivoSupplierLiveSyncTimer=setInterval(()=>{
            if(!document.getElementById('ysrPlannerOverlay')?.classList.contains('open'))syncNow();
          },2300);""","""window.__yardivoSupplierLiveSyncTimer=setInterval(()=>{
            if(document.hidden)return;
            if(!document.getElementById('ysrPlannerOverlay')?.classList.contains('open'))syncNow();
          },30000);""","supplier live 2.3s -> 30s")

          rep("setInterval(()=>refresh(false),10000);","""/* EGRESS CLEANUP: duplicate 10s list_internal polling retired.
             yardivo-v560-supplier-live-sync owns the 30s safety refresh; events/focus refresh immediately. */""","retire duplicate inbox 10s poll")

          rep("setInterval(()=>{if(!document.hidden){refresh(false);healOnline()}},12000);","setInterval(()=>{if(!document.hidden)healOnline()},60000);","stable health 12s list poll -> 60s connection-only")

          rep("setInterval(poll,1500);","setInterval(()=>{if(!document.hidden)poll()},60000);","inventory notif 1.5s -> 60s fallback")

          rep("timer=setInterval(()=>{const v=currentView();if(!document.hidden&&isSupplier()&&(v==='status'||v==='history'))pull(false)},3000)","timer=setInterval(()=>{const v=currentView();if(!document.hidden&&isSupplier()&&(v==='status'||v==='history'))pull(false)},30000)","supplier history 3s -> 30s")

          rep("setInterval(()=>{if(!document.hidden)ensureOnline(false)},5000)","setInterval(()=>{if(!document.hidden)ensureOnline(false)},60000)","connection watchdog 5s -> 60s")

          rep("""const STATE_EXACT=new Set(['yardivo_live_notifications_v1','yardivo_master_notifications_v1']);
          const CLIENT_KEY='yardivo_client_id_v1';""","""const STATE_EXACT=new Set(['yardivo_live_notifications_v1','yardivo_master_notifications_v1']);
          const OBSOLETE_STATE_KEYS=new Set([
            'studenac_announcements','yardivo_announcements','yms_announcements','yardivo_incidents',
            'yardivo_supplier_deliveries_v1','yardivo_supplier_requests_v1',
            'yardivo_supabase_offline_queue_v1','yardivo_supabase_offline_queue_v2',
            'yardivo_supabase_sync_meta_v1','yardivo_supabase_sync_meta_v2'
          ]);
          const CLIENT_KEY='yardivo_client_id_v1';""","add obsolete state denylist")

          rep("""function stateKey(k){
            k=String(k||'');
            try{""","""function stateKey(k){
            k=String(k||'');
            if(OBSOLETE_STATE_KEYS.has(k))return false;
            try{""","block obsolete state writes")

          p.write_text(s,encoding="utf-8")
          print("\n".join(changes))
      - name: Commit cleanup
        run: |
          git config user.name "YARDIVO Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Reduce Supabase egress and retire duplicate polling [skip ci]"
          git push
