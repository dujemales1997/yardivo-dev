name: Apply scanner route and validate
on:
  push:
    paths:
      - ".github/workflows/apply-scanner-route.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Point YARDIVO to stable scanner route
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="const SCANNER='YARDIVO_SCANNER_V5.8.3_ONE_QR.html';"
          new="const SCANNER='./scanner/';"
          n=s.count(old)
          if n==1:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit(f"scanner route marker mismatch: {n}")
          p.write_text(s,encoding="utf-8")
          print("Scanner route set to ./scanner/")
      - name: Validate scanner and desktop regression guards
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile, sys
          scanner=Path("scanner/index.html").read_text(encoding="utf-8")
          root=Path("YARDIVO_SCANNER_V5.8.3_ONE_QR.html").read_text(encoding="utf-8")
          desktop=Path("index.html").read_text(encoding="utf-8")
          req=[
            ('scanner explicit auth','id="auth" class="auth'),
            ('scanner welcome','id="welcome" class="welcome'),
            ('tracking login','data-step="login"'),
            ('tracking scope','data-step="scope"'),
            ('tracking warehouse','data-step="warehouse"'),
            ('tracking scanner','data-step="scanner"'),
            ('no silent login','Scanner Mobile always starts on explicit login'),
            ('scope backend','yardivo-user-scope'),
            ('gate backend','yardivo-gate-pass')
          ]
          for name,needle in req:
              if needle not in scanner: raise SystemExit("Missing "+name)
          if scanner!=root: raise SystemExit("Root scanner and /scanner/ route differ")
          if "const SCANNER='./scanner/';" not in desktop: raise SystemExit("Desktop scanner route not updated")
          for file_name,src in [("scanner/index.html",scanner),("YARDIVO_SCANNER_V5.8.3_ONE_QR.html",root)]:
              scripts=re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>",src,re.S|re.I)
              for i,code in enumerate(scripts,1):
                  if not code.strip(): continue
                  with tempfile.NamedTemporaryFile("w",suffix=".js",encoding="utf-8",delete=False) as f:
                      f.write(code); name=f.name
                  r=subprocess.run(["node","--check",name],capture_output=True,text=True)
                  if r.returncode:
                      print(file_name,"script",i,r.stderr)
                      sys.exit(1)
              print("PASS",file_name,len(scripts),"inline scripts")
          for needle in ["qa-smooth-theme-v15","function normalizeDock(v)","warehouseBookingState","yardivo_delay_settings_v1"]:
              if needle not in desktop: raise SystemExit("Desktop regression missing: "+needle)
          print("PASS desktop regression guards")
      - name: Commit route update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No desktop change needed"
            exit 0
          fi
          git config user.name "YARDIVO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Use stable YARDIVO scanner route"
          git push origin HEAD:main
