name: Validate scanner v3
on:
  push:
    paths:
      - ".github/workflows/validate-scanner-v3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scanner HTML and JS
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s=Path("scanner/index.html").read_text(encoding="utf-8")
          required=[
            "ODABERI MODUL",
            "QR SCAN JE OFF",
            "DNEVNA MAPA",
            "mobile_bootstrap",
            "data-status=\"received\"",
            "data-status=\"rejected\"",
            "data-status=\"dock\"",
            "data-status=\"arrival\""
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("Missing scanner v3 guards: "+", ".join(missing))
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",s,re.S|re.I)
          checked=0
          for i,code in enumerate(scripts,1):
              if not code.strip(): continue
              with tempfile.NamedTemporaryFile("w",suffix=".js",encoding="utf-8",delete=False) as f:
                  f.write(code); name=f.name
              r=subprocess.run(["node","--check",name],capture_output=True,text=True)
              checked+=1
              if r.returncode:
                  print("SCRIPT",i,"FAILED")
                  print(r.stderr)
                  sys.exit(1)
          print("PASS scanner v3 inline scripts:",checked)
          print("PASS scanner v3 UI guards")
