name: Apply gate approval popup
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-gate-popup-inspect.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gate approval popup
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          style_anchor=""".ysg-actions button{padding:8px 10px}
          @media(max-width:740px){.yvdp-box{grid-template-columns:1fr}.ysg-actions{grid-template-columns:1fr}}"""
          style_new=""".ysg-actions button{padding:8px 10px}
          #yardivoGateEntryDecisionPopupV583{position:fixed;left:50%;bottom:18px;z-index:2147482500;width:min(920px,calc(100vw - 24px));transform:translate(-50%,120%);opacity:0;pointer-events:none;transition:transform .24s ease,opacity .18s ease}
          #yardivoGateEntryDecisionPopupV583.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
          #yardivoGateEntryDecisionPopupV583 .ygdp-card{border-radius:18px;padding:20px 22px;box-shadow:0 28px 90px rgba(0,0,0,.56);border:1px solid}
          #yardivoGateEntryDecisionPopupV583.good .ygdp-card{background:linear-gradient(135deg,#0b4728,#0f6a3a);border-color:#48d784;color:#f0fff6}
          #yardivoGateEntryDecisionPopupV583.bad .ygdp-card{background:linear-gradient(135deg,#4b1119,#711923);border-color:#ff6a78;color:#fff4f5}
          #yardivoGateEntryDecisionPopupV583 .ygdp-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
          #yardivoGateEntryDecisionPopupV583 .ygdp-title{font-size:26px;font-weight:1000;letter-spacing:.02em;line-height:1.05}
          #yardivoGateEntryDecisionPopupV583 .ygdp-sub{margin-top:6px;font-size:11px;font-weight:800;opacity:.9;line-height:1.45}
          #yardivoGateEntryDecisionPopupV583 .ygdp-close{border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.14);color:#fff;width:38px;height:38px;border-radius:10px;font-size:20px;font-weight:1000;cursor:pointer}
          #yardivoGateEntryDecisionPopupV583 .ygdp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
          #yardivoGateEntryDecisionPopupV583 .ygdp-fact{padding:9px 10px;border-radius:9px;background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.13)}
          #yardivoGateEntryDecisionPopupV583 .ygdp-fact small{display:block;font-size:7px;font-weight:950;letter-spacing:.05em;opacity:.72;margin-bottom:3px}
          #yardivoGateEntryDecisionPopupV583 .ygdp-fact b{font-size:11px;word-break:break-word}
          #yardivoGateEntryDecisionPopupV583 .ygdp-alert{margin-top:12px;padding:10px 12px;border-radius:9px;background:rgba(0,0,0,.17);font-size:10px;font-weight:950;line-height:1.45}
          #yardivoGateEntryDecisionPopupV583 .ygdp-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
          #yardivoGateEntryDecisionPopupV583 .ygdp-actions button{min-height:42px;padding:10px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.28);font-weight:1000;cursor:pointer}
          #yardivoGateEntryDecisionPopupV583 .ygdp-actions .approve{background:#eafff1;color:#075228;border-color:#b8f1cd}
          #yardivoGateEntryDecisionPopupV583 .ygdp-actions .reject{background:#2b0d12;color:#ffd8dc;border-color:#a84b56}
          #yardivoGateEntryDecisionPopupV583 .ygdp-actions .inventory{background:#fff3d2;color:#573a00;border-color:#ffd873}
          @media(max-width:740px){.yvdp-box{grid-template-columns:1fr}.ysg-actions{grid-template-columns:1fr}#yardivoGateEntryDecisionPopupV583 .ygdp-grid{grid-template-columns:1fr 1fr}#yardivoGateEntryDecisionPopupV583 .ygdp-title{font-size:21px}}"""
          if style_anchor not in s:
              raise SystemExit("Gate style anchor not found")
          s=s.replace(style_anchor,style_new,1)

          fn_anchor="""async function loadGate(){
            if(!['admin','gate'].includes(role()))return;"""
          helper="""let gatePopupRow=null;
          function gatePopupSeenKey(x){
            return 'yardivo_gate_popup_seen_v583_'+String(x?.id||'')+'_'+String(x?.state||'')+'_'+String(x?.vehicle_plate||'')+'_'+String(x?.driver_name||'')+'_'+String(x?.updated_at||'');
          }
          function ensureGateDecisionPopup(){
            let m=document.getElementById('yardivoGateEntryDecisionPopupV583');if(m)return m;
            m=document.createElement('div');m.id='yardivoGateEntryDecisionPopupV583';
            m.innerHTML='<div class="ygdp-card"><div class="ygdp-head"><div><div class="ygdp-title" id="ygdpTitle">DOZVOLA ZA ULAZAK</div><div class="ygdp-sub" id="ygdpSub"></div></div><button type="button" class="ygdp-close" data-ygdp-close>×</button></div><div class="ygdp-grid" id="ygdpGrid"></div><div class="ygdp-alert" id="ygdpAlert"></div><div class="ygdp-actions" id="ygdpActions"></div></div>';
            document.body.appendChild(m);
            m.querySelector('[data-ygdp-close]').onclick=()=>{m.classList.remove('open');gatePopupRow=null};
            return m
          }
          function showGateDecisionPopup(x){
            if(!x||x.state!=='WAITING_GATE'||!['admin','gate'].includes(role()))return;
            const key=gatePopupSeenKey(x);
            try{if(sessionStorage.getItem(key)==='1')return;sessionStorage.setItem(key,'1')}catch(_){}
            const complete=!!String(x.vehicle_plate||'').trim()&&!!String(x.driver_name||'').trim();
            const m=ensureGateDecisionPopup();gatePopupRow=x;
            m.classList.toggle('good',complete);m.classList.toggle('bad',!complete);
            m.querySelector('#ygdpTitle').textContent=complete?'DOZVOLA ZA ULAZAK':'ULAZ NIJE SPREMAN';
            const ref=String(x.announcement_ref||x.announcement_id||'NAJAVA');
            m.querySelector('#ygdpSub').textContent=(x.supplier_name||'Dobavljač')+' · '+ref+' · '+(x.warehouse_name||x.warehouse||'');
            m.querySelector('#ygdpGrid').innerHTML=
              '<div class="ygdp-fact"><small>REGISTRACIJA</small><b>'+esc(x.vehicle_plate||'NIJE UNESENA')+'</b></div>'+
              '<div class="ygdp-fact"><small>VOZAČ</small><b>'+esc(x.driver_name||'NIJE UNESEN')+'</b></div>'+
              '<div class="ygdp-fact"><small>NARUDŽBA</small><b>'+esc(x.order_number||'OPCIONALNO / NIJE UNESENA')+'</b></div>'+
              '<div class="ygdp-fact"><small>RAMPA / TERMIN</small><b>'+esc((x.dock||'—')+' · '+(x.appointment_at?new Date(x.appointment_at).toLocaleString('hr-HR'):'—'))+'</b></div>';
            const alert=m.querySelector('#ygdpAlert'),actions=m.querySelector('#ygdpActions');
            if(complete){
              alert.textContent='Podaci su uredni. Portir može odobriti ulaz; nakon odobrenja status najave postaje U DVORIŠTU.';
              actions.innerHTML='<button type="button" class="reject" data-ygdp-reject>ODBIJ ULAZ</button><button type="button" class="approve" data-ygdp-approve>ODOBRI ULAZ</button>';
              actions.querySelector('[data-ygdp-approve]').onclick=async()=>{const id=String(x.id);m.classList.remove('open');gatePopupRow=null;await decide(id,'APPROVE')};
              actions.querySelector('[data-ygdp-reject]').onclick=async()=>{const id=String(x.id);m.classList.remove('open');gatePopupRow=null;await decide(id,'REJECT')};
            }else{
              const missing=[!String(x.vehicle_plate||'').trim()?'REGISTRACIJA':'',!String(x.driver_name||'').trim()?'IME VOZAČA':''].filter(Boolean).join(' + ');
              alert.textContent='Nedostaju obavezni podaci: '+missing+'. Ulaz se NE može odobriti. Pošalji zahtjev ZALIHAMA za dopunu.';
              actions.innerHTML='<button type="button" class="inventory" data-ygdp-inventory>ZAHTJEV ZALIHAMA</button>';
              actions.querySelector('[data-ygdp-inventory]').onclick=async()=>{
                const b=actions.querySelector('[data-ygdp-inventory]');b.disabled=true;b.textContent='ŠALJEM ZAHTJEV…';
                try{
                  await api('gate_request_inventory',{id:String(x.id),reason:missing});
                  b.textContent='ZAHTJEV POSLAN ZALIHAMA';
                  window.showYmsToast?.('success','ZAHTJEV POSLAN ZALIHAMA',missing+' · '+(x.vehicle_plate||x.supplier_name||'Najava'));
                }catch(e){b.disabled=false;b.textContent='ZAHTJEV ZALIHAMA';alert(e?.message||e)}
              };
            }
            requestAnimationFrame(()=>m.classList.add('open'))
          }
          function maybeShowGateDecisionPopup(rows){
            const waiting=(Array.isArray(rows)?rows:[]).filter(x=>x&&x.state==='WAITING_GATE').sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')));
            for(const x of waiting){
              const key=gatePopupSeenKey(x);let seen=false;try{seen=sessionStorage.getItem(key)==='1'}catch(_){}
              if(!seen){showGateDecisionPopup(x);break}
            }
          }

          async function loadGate(){
            if(!['admin','gate'].includes(role()))return;"""
          if fn_anchor not in s:
              raise SystemExit("loadGate anchor missing")
          s=s.replace(fn_anchor,helper,1)

          load_anchor="const d=await api('list_gate'),rows=d.rows||[],host=p.querySelector('#ysgRows');"
          if load_anchor not in s:
              raise SystemExit("loadGate rows anchor missing")
          s=s.replace(load_anchor,load_anchor+"\n    maybeShowGateDecisionPopup(rows);",1)

          # Make inline APPROVE respect the same missing-data rule before backend call.
          old="""async function decide(id,decision){
            const parking=document.querySelector(`[data-parking="${CSS.escape(id)}"]`)?.value||'P1';
            const message=document.querySelector(`[data-gmsg="${CSS.escape(id)}"]`)?.value||'';
            try{await api('gate_decide',{id,decision,parkingSlot:parking,message});await loadGate();window.showYmsToast?.('success',decision==='APPROVE'?'ULAZ ODOBREN':'ULAZ ODBIJEN','YARDIVO Delivery Pass je ažuriran.')}catch(e){alert(e?.message||e)}
          }"""
          new="""async function decide(id,decision){
            const parking=document.querySelector(`[data-parking="${CSS.escape(id)}"]`)?.value||'P1';
            const message=document.querySelector(`[data-gmsg="${CSS.escape(id)}"]`)?.value||'';
            try{
              await api('gate_decide',{id,decision,parkingSlot:parking,message});
              await loadGate();
              window.showYmsToast?.('success',decision==='APPROVE'?'ULAZ ODOBREN · U DVORIŠTU':'ULAZ ODBIJEN',decision==='APPROVE'?'Status najave je U DVORIŠTU.':'YARDIVO Delivery Pass je ažuriran.')
            }catch(e){
              const msg=String(e?.message||e);
              if(/DRIVER_INFO_REQUIRED|Nedostaju podaci/i.test(msg)){
                try{await loadGate()}catch(_){}
                alert('ULAZ NIJE MOGUĆ. Nedostaju obavezni podaci vozača. Pošalji ZAHTJEV ZALIHAMA.');
              }else alert(msg)
            }
          }"""
          if old not in s:
              raise SystemExit("decide anchor missing")
          s=s.replace(old,new,1)

          p.write_text(s,encoding="utf-8")
          Path(".github/workflows/yardivo-gate-popup-inspect.yml").unlink()

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess
          s=Path("index.html").read_text(encoding="utf-8")
          assert "yardivoGateEntryDecisionPopupV583" in s
          assert "DOZVOLA ZA ULAZAK" in s
          assert "ZAHTJEV ZALIHAMA" in s
          assert "gate_request_inventory" in s
          m=re.search(r'<script id="yardivo-self-gate-pass-v1">(.*?)</script>',s,re.S)
          assert m
          Path("/tmp/gate-popup.js").write_text(m.group(1),encoding="utf-8")
          subprocess.check_call(["node","--check","/tmp/gate-popup.js"])
      - name: Commit
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-gate-popup-inspect.yml
          git diff --cached --check
          git commit -m "Add gate entry approval popup and inventory request"
          git push origin HEAD:main
