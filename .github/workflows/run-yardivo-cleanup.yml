name: Run YARDIVO cleanup
on:
  push:
    paths:
      - ".github/workflows/run-yardivo-cleanup.yml"
      - ".github/scripts/yardivo_cleanup.py"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/yardivo_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "YARDIVO Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Consolidate YARDIVO runtime and Supplier data flow [skip ci]"
          git push
