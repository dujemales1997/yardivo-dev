name: YARDIVO chat realtime cleanup
on:
  push:
    paths:
      - ".github/workflows/yardivo-chat-realtime-cleanup.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat polling and add Realtime signal listener
        shell: python
        run: |
          from pathlib import Path
          import base64
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          def rep(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              s=s.replace(old,new)
          rep("setInterval(()=>{if(opened)loadMessages(true)},10000)","setInterval(()=>{if(opened)loadMessages(true)},120000)","help chat open fallback")
          rep("setInterval(pollBadge,30000)","setInterval(pollBadge,180000)","help chat badge fallback")
          rep("timer=setInterval(poll,30000)","timer=setInterval(poll,180000)","help chat admin popup fallback")
          rep("timer=setInterval(()=>{if(opened)refreshThreads(false).then(loadMessages)},10000)","timer=setInterval(()=>{if(opened)refreshThreads(false).then(loadMessages)},120000)","operational chat open fallback")
          rep("setInterval(()=>{if(!document.hidden&&!opened)refreshThreads(true)},30000)","setInterval(()=>{if(!document.hidden&&!opened)refreshThreads(true)},180000)","operational chat closed fallback")
          marker="</body>"
          if s.count(marker)!=1:
              raise SystemExit(f"body marker expected 1 match, got {s.count(marker)}")
          module=base64.b64decode("").decode("utf-8")
          if 'id="yardivo-v583-chat-realtime-signal-20260925"' not in s:
              s=s.replace(marker,module+"\n"+marker)
          p.write_text(s,encoding="utf-8")
      - name: Commit chat cleanup
        run: |
          git config user.name "YARDIVO Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use Realtime signals for YARDIVO chats [skip ci]"
          git push
