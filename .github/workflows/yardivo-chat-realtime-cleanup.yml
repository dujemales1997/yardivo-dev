name: YARDIVO chat realtime cleanup
on:
  push:
    paths:
      - ".github/workflows/yardivo-chat-realtime-cleanup.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat runtime
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          if 'id="yardivo-v583-chat-realtime-signal-final"' in s:
              raise SystemExit("Realtime chat client already present")
          marker='</body>'
          if marker not in s:
              raise SystemExit("Missing </body>")
          block=r'''<script id="yardivo-v583-chat-realtime-signal-final">
          (()=>{'use strict';
          if(window.__YARDIVO_CHAT_REALTIME_SIGNAL_FINAL__)return;
          window.__YARDIVO_CHAT_REALTIME_SIGNAL_FINAL__=true;
          let ch=null,reconnectTimer=0,refreshTimer=0;

          function scheduleRefresh(kind){
            clearTimeout(refreshTimer);
            refreshTimer=setTimeout(()=>{
              if(kind==='help'||kind==='chat'){
                try{window.YardivoHelpChatV583?.refresh?.(true)}catch(_){}
                try{window.YardivoHelpChatAdminPopupsV583?.refresh?.()}catch(_){}
              }
              if(kind==='operational'||kind==='chat'){
                try{window.YardivoOperationalChatV583?.refresh?.()}catch(_){}
              }
            },80);
          }

          async function connect(){
            if(ch)return ch;
            const c=await window.YardivoAuth?.client?.();
            if(!c)return null;
            try{
              const session=(await c.auth.getSession())?.data?.session;
              if(session?.access_token)await c.realtime?.setAuth?.(session.access_token);
            }catch(_){}
            const next=c.channel('yardivo-chat',{config:{private:true}});
            next.on('broadcast',{event:'changed'},payload=>{
              scheduleRefresh(String(payload?.payload?.kind||'chat'));
            });
            next.subscribe(status=>{
              const st=String(status||'').toUpperCase();
              if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){
                if(ch===next)ch=null;
                clearTimeout(reconnectTimer);
                reconnectTimer=setTimeout(connect,5000);
              }
            });
            ch=next;
            return ch;
          }

          async function disconnect(){
            const c=await window.YardivoAuth?.client?.();
            const old=ch;ch=null;
            clearTimeout(reconnectTimer);
            if(old&&c){try{await c.removeChannel(old)}catch(_){}}
          }

          ['yardivo:login','yardivo:online-ready'].forEach(ev=>{
            window.addEventListener(ev,()=>setTimeout(connect,120));
          });
          window.addEventListener('focus',()=>setTimeout(connect,120));
          window.addEventListener('yardivo:logout',()=>{void disconnect()});
          window.addEventListener('pagehide',()=>{void disconnect()},{once:true});
          setTimeout(connect,1200);

          window.YardivoChatRealtimeV583={
            connect,disconnect,status:()=>ch?'ACTIVE':'OFF'
          };
          })();
          </script>
          '''
          s=s.replace(marker,block+'\n'+marker,1)
          p.write_text(s,encoding="utf-8")
      - name: Verify chat cleanup
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          checks={
            "realtime client": 'id="yardivo-v583-chat-realtime-signal-final"' in s,
            "help 120s open fallback": "chatTimer=setInterval(()=>{if(opened)loadMessages(true)},120000)" in s,
            "help 180s badge fallback": "badgeTimer=setInterval(pollBadge,180000)" in s,
            "help admin 180s fallback": "timer=setInterval(poll,180000)" in s,
            "operational 120s open fallback": "timer=setInterval(()=>{if(opened)refreshThreads(false).then(loadMessages)},120000)" in s,
            "operational 180s closed fallback": "setInterval(()=>{if(!document.hidden&&!opened)refreshThreads(true)},180000)" in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit("Missing checks: "+", ".join(bad))
          print(checks)
      - name: Commit
        run: |
          git config user.name "YARDIVO Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Switch YARDIVO chats to Realtime signals [skip ci]"
          git push
