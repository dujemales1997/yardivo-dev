name: Reset account choice and login greeting
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-reset-login-greeting.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          
          old="async function factoryResetServer(){const c=await client(),{data,error}=await c.functions.invoke('yardivo-factory-reset',{body:{confirm:'RESET YARDIVO'}});if(error)throw error;if(!data?.ok)throw new Error(data?.error||'Server Factory Zero nije uspio.');return data}"
          new="async function factoryResetServer(deleteAccounts){const c=await client(),{data,error}=await c.functions.invoke('yardivo-factory-reset',{body:{confirm:'RESET YARDIVO',delete_accounts:deleteAccounts===true}});if(error)throw error;if(!data?.ok)throw new Error(data?.error||'Server Factory Zero nije uspio.');return data}"
          assert old in s
          s=s.replace(old,new,1)
          
          a="Factory Zero briše poslovne podatke, konfiguraciju, Supplier/Gate podatke, sve Self Gate QR kodove/tokene i sve druge korisnike. Ostaje samo Admin dujemales."
          b="Factory Zero briše poslovne podatke, konfiguraciju, Supplier/Gate podatke i sve Self Gate QR kodove/tokene. Prije izvršenja posebno biraš želiš li obrisati i korisničke accounte; Admin / Yard Manager dujemales se nikada ne briše."
          s=s.replace(a,b,1)
          s=s.replace("<span>BRIŠE SVE DRUGE KORISNIKE</span>","<span>ACCOUNTI: PO IZBORU · DUJEMALES OSTAJE</span>",1)
          s=s.replace("OSTAJE SAMO: <strong id=\\"yardivoResetKeeperLabel\\">TRENUTNI ADMIN</strong> + aktivna autentikacijska sesija.","ZAŠTIĆENI ACCOUNT: <strong id=\\"yardivoResetKeeperLabel\\">TRENUTNI ADMIN</strong> + aktivna autentikacijska sesija.",1)
          
          vstart=s.index("async function verifyEmpty(keep){")
          vend=s.index("\\nasync function resetYardivo(){",vstart)
          assert vstart>=0 and vend>vstart
          verify="""async function verifyEmpty(keep,deleteAccounts){
           const checks={localAnnouncements:-1,localIncidents:-1,locations:-1,warehouses:-1,suppliers:-1,responsiblePeople:-1,qrEnabled:null,users:null};
           try{
            checks.localAnnouncements=JSON.parse(localStorage.getItem('yardivo_yms_announcements_v1')||'[]').length;
            checks.localIncidents=JSON.parse(localStorage.getItem('yardivo_yms_incidents_v1')||'[]').length;
            const m=JSON.parse(localStorage.getItem(MASTER)||'{}');
            checks.locations=(m.locations||[]).length;checks.warehouses=(m.warehouses||[]).length;checks.suppliers=(m.suppliers||[]).length;checks.responsiblePeople=(m.responsible_people||[]).length;
            checks.qrEnabled=JSON.parse(localStorage.getItem('yardivo_qr_scan_cfg_v583')||'{"enabled":false}').enabled===true;
           }catch(_){}
           try{const r=await adminInvoke('list',{}),u=Array.isArray(r)?r:(r?.users||[]);checks.users=u.map(x=>({username:norm(x.username),role:norm(x.app_role),active:x.active!==false}))}catch(_){}
           const admins=Array.isArray(checks.users)?checks.users.filter(x=>x.username===keep&&x.role==='admin'&&x.active):[];
           const userOk=deleteAccounts?(Array.isArray(checks.users)&&checks.users.length===1&&admins.length===1):admins.length===1;
           const dataOk=checks.localAnnouncements===0&&checks.localIncidents===0&&checks.locations===0&&checks.warehouses===0&&checks.suppliers===0&&checks.responsiblePeople===0&&checks.qrEnabled===false;
           return {ok:dataOk&&userOk,dataOk,userOk,checks}
          }"""
          s=s[:vstart]+verify+s[vend:]
          
          start=s.index("async function resetYardivo(){")
          end=s.index("\\nfunction ensureBottom()",start)
          assert start>=0 and end>start
          replacement="""async function resetYardivo(){
           if(busy)return;let keep;
           try{keep=keeper()}catch(e){alert(e.message);return}
           if(!confirm(\`RESET YARDIVO — POTPUNI FACTORY ZERO\\n\\nBrišu se poslovni podaci: lokacije, skladišta, rampe, dobavljači, odgovorne osobe, najave, Supplier najave, incidenti, QR/Gate povijest, notifikacije, audit i app state.\\n\\nU sljedećem koraku biraš želiš li obrisati i korisničke accounte.\\n\\nAdmin / Yard Manager dujemales se NE BRIŠE.\\n\\nNastaviti?\`))return;
           const deleteAccounts=confirm('ŽELIŠ LI OBRISATI SVE KORISNIČKE ACCOUNTE?\\n\\nDA = brišu se svi Auth/User accounti osim Admin / Yard Manager dujemales.\\n\\nNE = accounti ostaju, a poslovni sustav se svejedno vraća na 0.');
           const typed=prompt('Za konačnu potvrdu upiši točno:\\nRESET YARDIVO');
           if(String(typed||'').trim().toUpperCase()!=='RESET YARDIVO')return;
           const btn=document.getElementById('yardivoResetYardivoBtn');busy=true;if(btn){btn.disabled=true;btn.textContent='RESETIRAM YARDIVO…'}
           try{
            status('1/5 · Provjeravam Admin / Yard Manager account dujemales…');
            const before=await adminInvoke('list',{}),users=Array.isArray(before)?before:(before?.users||[]);
            if(!users.some(u=>norm(u.username)===keep&&norm(u.app_role)==='admin'&&u.active!==false))throw new Error('Aktivni Admin dujemales nije pronađen. Ništa nije obrisano.');
            status('2/5 · Server Factory Zero briše poslovne podatke'+(deleteAccounts?' i druge korisničke accounte…':' · korisnički accounti ostaju…'));
            const server=await factoryResetServer(deleteAccounts);
            if(!server?.factoryZero||server?.deleteAccounts!==deleteAccounts||!Array.isArray(server?.app_state_keys)||server.app_state_keys.length!==4)throw new Error('Server nije potvrdio potpuni Factory Zero.');
            if(deleteAccounts&&server?.users!==1)throw new Error('Server nije potvrdio da je ostao samo Admin dujemales.');
            if(Number(server?.self_gate?.tokens)!==0||Number(server?.self_gate?.passes)!==0||Number(server?.self_gate?.events)!==0)throw new Error('Self Gate podaci nisu potpuno obrisani. Reset je zaustavljen radi sigurnosti.');
            status('3/5 · Čistim sav lokalni YARDIVO state i cache…');
            localHardReset(keep);
            status('4/5 · Vraćam prazan Master i SMART/QR na OFF…');
            rerenderEmpty();
            status('5/5 · Verificiram 0 poslovnih podataka'+(deleteAccounts?' i samo dujemales account…':'…'));
            const v=await verifyEmpty(keep,deleteAccounts);if(!v.ok)throw new Error('Factory Zero je pokrenut, ali završna verifikacija nije potpuno čista.');
            status(\`✓ FACTORY ZERO · 0 POSLOVNIH PODATAKA · \${deleteAccounts?'SAMO DUJEMALES ACCOUNT':'ACCOUNTI SAČUVANI'}\`,'ok');
            try{showYmsToast?.('success','YARDIVO FACTORY ZERO',deleteAccounts?'Sve je na 0. Ostao je samo Admin / Yard Manager dujemales.':'Sve je na 0. Korisnički accounti su sačuvani.')}catch(_){}
            alert(\`YARDIVO je resetiran.\\n\\n0 lokacija\\n0 skladišta\\n0 dobavljača\\n0 odgovornih osoba\\n0 najava / incidenata / QR povijesti\\nSMART OFF\\nQR SCAN OFF\\n\\n\${deleteAccounts?'Korisnici: obrisani svi osim Admin / Yard Manager dujemales.':'Korisnici: SAČUVANI.'}\`);
           }catch(e){
            console.error('[RESET YARDIVO]',e);status('RESET NIJE ZAVRŠIO 100%: '+String(e?.message||e),'error');alert('RESET YARDIVO nije završio 100%:\\n\\n'+String(e?.message||e))
           }finally{busy=false;if(btn){btn.disabled=false;btn.textContent='RESET YARDIVO — VRATI SVE NA 0'}}
          }"""
          s=s[:start]+replacement+s[end:]
          
          greeting="""<script id="yardivo-v583-login-ai-welcome-20260924">
          (()=>{'use strict';
          if(window.__YARDIVO_LOGIN_AI_WELCOME_20260924__)return;
          window.__YARDIVO_LOGIN_AI_WELCOME_20260924__=true;
          let seq=0;
          function role(){let r=String(window.currentSession?.app_role||window.currentSession?.role||'').trim().toLowerCase();if(r==='voditelj'||r==='management')r='manager';if(r==='zalihe'||r.includes('zalih'))r='inventory';if(r==='prijam')r='reception';if(r==='porta'||r==='portir')r='gate';return r}
          function today(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
          function visibleLocalToday(){try{const d=today(),arr=Array.isArray(window.announcements)?window.announcements:(typeof announcements!=='undefined'&&Array.isArray(announcements)?announcements:[]),s=window.currentSession||{},allowed=new Set(Array.isArray(s.warehouses)?s.warehouses.map(String):[]);return arr.filter(a=>{const date=String(a?.date||a?.appointment_date||a?.payload?.date||'').slice(0,10),wh=String(a?.warehouse||a?.payload?.warehouse||''),scoped=s.all_warehouses===true||role()==='admin'||!allowed.size||allowed.has(wh),st=String(a?.status||a?.payload?.status||'').toLowerCase();return date===d&&scoped&&!['obrisano','deleted','cancelled','canceled'].includes(st)}).length}catch(_){return 0}}
          async function supplierToday(){try{const raw=await window.YardivoSupplierLiveSync?.call?.('list_mine');if(!Array.isArray(raw))return visibleLocalToday();const d=today();return raw.filter(x=>String(x?.delivery_date||'').slice(0,10)===d&&!['deleted','cancelled','canceled'].includes(String(x?.effective_status||x?.status||'').toLowerCase())).length}catch(_){return visibleLocalToday()}}
          async function countToday(){if(role()==='supplier')return await supplierToday();await new Promise(r=>setTimeout(r,700));return visibleLocalToday()}
          async function greet(mySeq){if(mySeq!==seq||!window.currentSession)return;try{if(localStorage.getItem('yardivo_notification_sound_mode_v2')==='off')return;const n=await countToday();if(mySeq!==seq||!window.currentSession)return;const word=n===1?'najavu':'najava',body='Dobrodošli u YARDIVO. Danas imate '+n+' '+word+'.',api=window.YardivoAIVoiceNotifications;if(api?.readNow)api.readNow({id:'YARDIVO-LOGIN-'+Date.now(),title:'',body});else if(api?.test)await api.test(body)}catch(e){console.warn('[YARDIVO login AI welcome]',e)}}
          window.addEventListener('yardivo:login',()=>{const my=++seq;setTimeout(()=>greet(my),900)});
          window.addEventListener('yardivo:logout',()=>{seq++});
          })();
          </script>"""
          assert "yardivo-v583-login-ai-welcome-20260924" not in s
          assert "</body>" in s
          s=s.replace("</body>",greeting+"\\n</body>",1)
          p.write_text(s,encoding="utf-8")
          
          s=p.read_text(encoding="utf-8")
          assert "delete_accounts:deleteAccounts===true" in s
          assert "ŽELIŠ LI OBRISATI SVE KORISNIČKE ACCOUNTE?" in s
          assert "Dobrodošli u YARDIVO. Danas imate " in s
          for sid in ["yardivo-v583-dev-total-reset-final","yardivo-v583-login-ai-welcome-20260924"]:
              m=re.search(r'<script[^>]+id="'+re.escape(sid)+r'"[^>]*>(.*?)</script>',s,re.S)
              assert m,sid
              q="/tmp/"+sid+".js";Path(q).write_text(m.group(1),encoding="utf-8");subprocess.check_call(["node","--check",q])
          Path(".github/workflows/yardivo-reset-login-greeting.yml").unlink()
          
      - name: Commit
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-reset-login-greeting.yml
          git diff --cached --check
          git commit -m "Add reset account choice and AI login welcome"
          git push origin HEAD:main
