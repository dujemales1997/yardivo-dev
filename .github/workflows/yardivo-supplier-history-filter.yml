name: Apply supplier history rule
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/yardivo-supplier-history-filter.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch supplier history
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('index.html')
          s=p.read_text(encoding='utf-8',errors='replace')
          sid='yardivo-v583-supplier-history-status-server-authority-20260923'
          m=re.search(r'(<script[^>]+id="'+re.escape(sid)+r'"[^>]*>)(.*?)(</script>)',s,re.S)
          if not m:
              raise SystemExit('supplier authority script missing')
          js=m.group(2)
          old="const history=rows.filter(x=>!['pending','revision_requested','proposal_sent'].includes(statusKey(x.status)));"
          new="const history=rows.filter(x=>['confirmed','arrival','dock','receiving','completed','rejected'].includes(statusKey(x.status)));"
          if old in js:
              js=js.replace(old,new,1)
          elif new not in js:
              raise SystemExit('history filter anchor missing')
          oldall="function renderAll(){if(!isSupplier())return;renderStatus();renderKpis();hideFloatingSupplierUi()}"
          newall="function renderAll(){if(!isSupplier())return;renderStatus();renderHistory();renderKpis();hideFloatingSupplierUi()}"
          if oldall in js:
              js=js.replace(oldall,newall,1)
          elif newall not in js:
              raise SystemExit('renderAll anchor missing')
          oldpoll="timer=setInterval(()=>{if(!document.hidden&&isSupplier()&&currentView()==='status')pull(false)},3000)"
          newpoll="timer=setInterval(()=>{const v=currentView();if(!document.hidden&&isSupplier()&&(v==='status'||v==='history'))pull(false)},3000)"
          if oldpoll in js:
              js=js.replace(oldpoll,newpoll,1)
          elif newpoll not in js:
              raise SystemExit('poll anchor missing')
          out=s[:m.start(2)]+js+s[m.end(2):]
          p.write_text(out,encoding='utf-8')
          Path('/tmp/supplier-authority.js').write_text(js,encoding='utf-8')
          subprocess.check_call(['node','--check','/tmp/supplier-authority.js'])
          assert new in js
          assert newall in js
          assert newpoll in js
          PY
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/yardivo-supplier-history-filter.yml
          git add index.html
          git diff --cached --check
          git commit -m "Restore filtered supplier history"
          git push origin HEAD:main
