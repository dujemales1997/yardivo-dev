name: Fix supplier history decision filter
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-supplier-history-filter.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Supplier history filter
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="const history=rows.filter(x=>['completed','rejected'].includes(statusKey(x.status)));"
          new="const history=rows.filter(x=>!['pending','revision_requested','proposal_sent'].includes(statusKey(x.status)));"
          if old not in s:
              raise SystemExit("supplier history filter anchor missing")
          s=s.replace(old,new,1)
          s=s.replace("Još nema zaprimljenih ili odbijenih najava.","Još nema potvrđenih ili odbijenih najava.",1)
          s=s.replace("Povijest se učitava izravno iz YARDIVO baze. Ovdje su završene narudžbe: zaprimljene i odbijene, s njihovim zadnjim statusom.","Povijest se učitava izravno iz YARDIVO baze. Ovdje su potvrđene, operativne, završene i odbijene najave. Najave koje čekaju potvrdu ostaju samo u Stanje najave / Isporuke.",1)
          p.write_text(s,encoding="utf-8")
          Path(".github/workflows/yardivo-supplier-history-filter.yml").unlink()
      - name: Validate Supplier authority
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s=Path("index.html").read_text(encoding="utf-8")
          assert "const history=rows.filter(x=>!['pending','revision_requested','proposal_sent'].includes(statusKey(x.status)))" in s
          assert "Najave koje čekaju potvrdu ostaju samo u Stanje najave / Isporuke." in s
          m=re.search(r'<script[^>]+id="yardivo-v583-supplier-history-status-server-authority-20260923"[^>]*>(.*?)</script>',s,re.S)
          if not m: raise SystemExit("supplier authority script missing")
          Path("/tmp/supplier-authority.js").write_text(m.group(1),encoding="utf-8")
          subprocess.check_call(["node","--check","/tmp/supplier-authority.js"])
      - name: Commit
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-supplier-history-filter.yml
          git diff --cached --check
          git commit -m "Fix supplier history decision filter"
          git push origin HEAD:main
