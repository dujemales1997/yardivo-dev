name: Inspect supplier history renderer
on:
  push:
    paths:
      - '.github/workflows/yardivo-supplier-history-filter.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8',errors='replace')
          for needle in ['function renderHistory','yspHistoryBody','Povijest se učitava']:
              print('\n===== '+needle+' =====')
              start=0
              for _ in range(10):
                  i=s.find(needle,start)
                  if i<0: break
                  print(s[max(0,i-1800):min(len(s),i+7000)])
                  start=i+len(needle)
          PY
