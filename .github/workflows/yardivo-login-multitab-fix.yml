name: Fix multi tab auth storage
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-login-multitab-fix.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth storage
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}"
          new="{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:window.sessionStorage}}"
          count=s.count(old)
          if count!=2:
              raise SystemExit("auth config count="+str(count))
          s=s.replace(old,new)
          p.write_text(s,encoding="utf-8")
      - name: Validate auth scripts
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s=Path("index.html").read_text(encoding="utf-8")
          assert s.count("storage:window.sessionStorage")==2
          for sid in ["yardivo-auth-driver-role-final-fix","yardivo-online-sync-v2-20260902","yardivo-canonical-login-router-v2-20260901"]:
              m=re.search(r'<script[^>]+id="'+re.escape(sid)+r'"[^>]*>(.*?)</script>',s,re.S)
              assert m, sid
              q="/tmp/"+sid+".js"
              Path(q).write_text(m.group(1),encoding="utf-8")
              subprocess.check_call(["node","--check",q])
      - name: Commit
        run: |
          rm -f .github/workflows/yardivo-login-multitab-fix.yml
          rm -f .github/workflows/yardivo-multitab-login-fix.yml
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows
          git diff --cached --check
          git commit -m "Isolate auth sessions per browser tab"
          git push origin HEAD:main
