name: Restore Supplier History
on:
  push:
    paths:
      - '.github/workflows/yardivo-restore-supplier-history.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          nav_old='''<button class="active" data-i18n="navNew" data-ysp-view="new" type="button">NAJAVA</button>
          <button data-i18n="navStatus" data-ysp-view="status" type="button">STANJE NAJAVE I ISPORUKE</button>
          <button data-i18n="navSettings" data-ysp-view="settings" type="button">POSTAVKE</button>'''
          nav_new='''<button class="active" data-i18n="navNew" data-ysp-view="new" type="button">NAJAVA</button>
          <button data-i18n="navStatus" data-ysp-view="status" type="button">STANJE NAJAVE I ISPORUKE</button>
          <button data-i18n="navHistory" data-ysp-view="history" type="button">POVIJEST NAJAVA</button>
          <button data-i18n="navSettings" data-ysp-view="settings" type="button">POSTAVKE</button>'''
          if nav_old not in s: raise SystemExit('nav anchor missing')
          s=s.replace(nav_old,nav_new,1)

          status='''<section class="ysp-view" data-ysp-section="status">
          <div class="ysp-card">
          <h2 data-i18n="statusTitle">Stanje najave i isporuke</h2>'''
          hist='''<section class="ysp-view" data-ysp-section="history">
          <div class="ysp-card">
          <h2 data-i18n="historyTitle">Povijest najava</h2>
          <p class="muted">Zaprimljene i odbijene narudžbe ovog Supplier računa.</p>
          <div class="data-wrap"><table class="ysp-table">
          <thead><tr><th>NAJAVA</th><th>DATUM / TERMIN</th><th>SKLADIŠTE</th><th>NARUDŽBA / PO</th><th>STATUS</th><th>RAMPA</th><th>VOZILO / QR DOCK</th></tr></thead>
          <tbody id="yspHistoryBody"><tr><td colspan="7"><div class="ysph-empty">Učitavanje povijesti...</div></td></tr></tbody>
          </table></div>
          </div>
          </section>
          '''+status
          if status not in s: raise SystemExit('status anchor missing')
          s=s.replace(status,hist,1)

          old='''function renderHistory(){
            const body=$('yspHistoryBody');if(!body)return;ensureHistoryNote();
            if(!rows.length){body.innerHTML='<tr><td colspan="7"><div class="ysph-empty">Još nema poslanih najava u YARDIVO bazi.</div></td></tr>';return}
            body.innerHTML=rows.map(x=>{'''
          new='''function renderHistory(){
            const body=$('yspHistoryBody');if(!body)return;ensureHistoryNote();
            const history=rows.filter(x=>['completed','rejected'].includes(statusKey(x.status)));
            if(!history.length){body.innerHTML='<tr><td colspan="7"><div class="ysph-empty">Još nema zaprimljenih ili odbijenih najava.</div></td></tr>';return}
            body.innerHTML=history.map(x=>{'''
          if old not in s: raise SystemExit('canonical history anchor missing')
          s=s.replace(old,new,1)

          s=s.replace('Povijest se učitava izravno iz YARDIVO baze. Ovdje su sve najave i narudžbe ovog Supplier računa, uključujući završene, s njihovim zadnjim statusom.','Povijest se učitava izravno iz YARDIVO baze. Ovdje su završene narudžbe: zaprimljene i odbijene, s njihovim zadnjim statusom.')
          s=s.replace('Nema aktivnih najava. Završene i prethodne najave nalaze se u Povijesti najava.','Nema aktivnih najava. Zaprimljene i odbijene narudžbe nalaze se u Povijesti najava.')

          assert 'const history=rows.filter' in s
          assert 'data-ysp-view="history"' in s
          assert 'id="yspHistoryBody"' in s
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/yardivo-restore-supplier-history.yml').unlink()
          PY
      - name: Validate scripts
        run: |
          python <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script[^>]+id="yardivo-v583-supplier-history-status-server-authority-20260923"[^>]*>(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/supplier.js').write_text(m.group(1),encoding='utf-8')
          subprocess.check_call(['node','--check','/tmp/supplier.js'])
          assert "['completed','rejected']" in m.group(1)
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-restore-supplier-history.yml
          git commit -m "Restore supplier completed and rejected history"
          git push origin HEAD:main
