name: Inspect exact QR scanner app
on:
  push:
    paths:
      - ".github/workflows/yardivo-scan-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect scanner scripts only
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8",errors="replace")
          for m in re.finditer(r'<script(?:\s+id="([^"]+)")?[^>]*>(.*?)</script>',s,re.S|re.I):
              sid=m.group(1) or ''
              body=m.group(2)
              low=(sid+' '+body).lower()
              if any(k in low for k in ['barcodedetector','html5-qrcode','getusermedia','scan qr','scanner','gate-pass']):
                  print("\n===== SCRIPT",sid,"@ ",m.start(),"=====\n")
                  print(body[:42000])
