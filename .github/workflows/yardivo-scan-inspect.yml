name: Inspect exact QR scanner app
on:
  push:
    paths:
      - ".github/workflows/yardivo-scan-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect scanner identifiers
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8",errors="replace")
          needles=["scanGate","gateScanner","dockScanner","qrScanner","scannerMode","scanMode","scannerApp","scanResult","scanState","consume","validate","gateUrl","dockUrl","NEMA DOZVOLE","ODJAVA","logout","signOut","POZDRAV","DOBRODOŠ"]
          for n in needles:
              start=0
              for k in range(8):
                  i=s.lower().find(n.lower(),start)
                  if i<0: break
                  print(f"\n===== {n} #{k+1} @ {i} =====\n")
                  print(s[max(0,i-4500):min(len(s),i+9000)])
                  start=i+len(n)
