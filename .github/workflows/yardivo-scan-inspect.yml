name: Inspect scanner mobile UI
on:
  push:
    paths:
      - ".github/workflows/yardivo-scan-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8",errors="replace")
          needles=["mobile_bootstrap","GATE_ROLE_REQUIRED","RECEPTION_ROLE_REQUIRED","QR_SCAN_DISABLED","warehouseName","nextAction","scan camera","scan-camera","mobile scanner","qrMobile"]
          for n in needles:
              start=0
              for k in range(12):
                  i=s.find(n,start)
                  if i<0: break
                  print(f"\n===== {n} #{k+1} @ {i} =====\n")
                  print(s[max(0,i-9000):min(len(s),i+19000)])
                  start=i+len(n)
