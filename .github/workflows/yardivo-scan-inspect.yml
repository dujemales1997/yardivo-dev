name: Inspect scanner routing
on:
  push:
    paths:
      - ".github/workflows/yardivo-scan-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8",errors="replace")
          needles=["location.pathname","/q/","scan=gate","scan=dock","scanner=","mobileScan","mobile-scan","gateScanner","dockScanner","SCAN GATE","SCAN DOCK"]
          for n in needles:
              start=0
              for k in range(20):
                  i=s.lower().find(n.lower(),start)
                  if i<0: break
                  print(f"\n===== {n} #{k+1} @ {i} =====\n")
                  print(s[max(0,i-5000):min(len(s),i+11000)])
                  start=i+len(n)
