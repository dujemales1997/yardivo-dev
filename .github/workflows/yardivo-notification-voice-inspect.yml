name: Inspect notification voice
on:
  push:
    paths:
      - ".github/workflows/yardivo-notification-voice-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect notification voice hooks
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8",errors="replace")
          needles=["speechSynthesis","yardivoLiveToasts","showYmsToast","yardivo_live_notifications_v1","renderNotifications","notification"]
          for n in needles:
              print("\n===== "+n+" =====")
              start=0
              for k in range(20):
                  i=s.find(n,start)
                  if i<0: break
                  print(f"--- {k+1} @ {i} ---")
                  print(s[max(0,i-2500):min(len(s),i+7000)])
                  start=i+len(n)
