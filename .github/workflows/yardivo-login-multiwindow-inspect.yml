name: Apply multiwindow auth fix
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/yardivo-login-multiwindow-inspect.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/yardivo_fix_multiwindow.py
      - name: Validate diff
        run: git diff --check
      - name: Commit
        run: |
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix multiwindow login stability"
          git push origin HEAD:main
