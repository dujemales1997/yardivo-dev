name: Apply YARDIVO v15 QA hardening

on:
  push:
    paths:
      - ".github/workflows/apply-yardivo-v15.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply QA and smooth theme hardening
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          if "qa-smooth-theme-v15" in s:
              print("v15 already applied")
              raise SystemExit(0)

          def rep(old,new,label,count=1):
              global s
              n=s.count(old)
              if n < count:
                  raise SystemExit(f"{label}: expected at least {count}, got {n}")
              s=s.replace(old,new,count)

          # First paint: theme identity exists before BODY is parsed.
          rep(
          """   document.documentElement.classList.add('yardivo-booting');
             document.documentElement.setAttribute('data-yardivo-main-theme',main);
             document.documentElement.setAttribute('data-yardivo-dark-look',dark);""",
          """   document.documentElement.classList.add('yardivo-booting');
             document.documentElement.classList.toggle('light-mode',main==='light');
             document.documentElement.classList.toggle('dark-mode',main==='dark');
             document.documentElement.setAttribute('data-yardivo-main-theme',main);
             document.documentElement.setAttribute('data-theme',main);
             document.documentElement.setAttribute('data-yardivo-theme',main);
             document.documentElement.setAttribute('data-yardivo-dark-look',dark);
             document.documentElement.style.colorScheme=main;""",
          "first paint theme sync",1)

          # Runtime AbsoluteWhite painter is obsolete: CSS is authoritative.
          pat=r'<script id="yardivo-light-absolute-white-v4-20260901-js">.*?</script>'
          repl='''<script id="yardivo-light-absolute-white-v4-20260901-js">
          (function(){
          'use strict';
          function enforce(){
            const html=document.documentElement,body=document.body;if(!body)return;
            const light=html.dataset.yardivoMainTheme==='light'||html.dataset.theme==='light';
            body.classList.toggle('light-mode',light);
            body.classList.toggle('dark-mode',!light);
            if(light)body.classList.remove('yardivo-light-green');
          }
          window.YardivoAbsoluteWhite={apply:enforce};
          })();
          </script>'''
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f"absolute white runtime: expected 1, got {n}")

          # Full-white V5 stays CSS-only. Remove whole-DOM computed-style scans/observers.
          pat=r'<script id="yardivo-light-full-white-v5-js">.*?</script>'
          repl='''<script id="yardivo-light-full-white-v5-js">
          (function(){
          'use strict';
          if(window.__YARDIVO_LIGHT_FULL_WHITE_V5__)return;
          window.__YARDIVO_LIGHT_FULL_WHITE_V5__=true;
          function apply(){
            const root=document.documentElement,body=document.body;if(!body)return;
            const light=root.dataset.yardivoMainTheme==='light'||root.dataset.theme==='light';
            body.classList.toggle('light-mode',light);
            body.classList.toggle('dark-mode',!light);
            if(light)body.classList.remove('yardivo-light-green');
          }
          window.YardivoLightFullWhiteV5={apply};
          })();
          </script>'''
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f"full white runtime: expected 1, got {n}")

          # Theme full-authority dark painter: restore only elements it actually touched.
          rep(
          """const root=document.documentElement;
          const touched=new WeakMap();""",
          """const root=document.documentElement;
          const touched=new WeakMap();
          const touchedEls=new Set();""",
          "authority touched set",1)
          rep(
          """  if(!(prop in rec))rec[prop]=el.style.getPropertyValue(prop);
            return rec;""",
          """  if(!(prop in rec))rec[prop]=el.style.getPropertyValue(prop);
            touchedEls.add(el);
            return rec;""",
          "authority track touched",1)
          rep(
          """function restore(){
            document.querySelectorAll('*').forEach(el=>{
              const rec=touched.get(el);if(!rec)return;
              Object.entries(rec).forEach(([prop,val])=>{if(val)el.style.setProperty(prop,val);else el.style.removeProperty(prop)});
              touched.delete(el);
            });
          }""",
          """function restore(){
            for(const el of Array.from(touchedEls)){
              const rec=touched.get(el);
              if(rec)Object.entries(rec).forEach(([prop,val])=>{if(val)el.style.setProperty(prop,val);else el.style.removeProperty(prop)});
              touched.delete(el);
              touchedEls.delete(el);
            }
          }""",
          "authority efficient restore",1)

          # Full palette painter: same optimization; never scan full DOM just to restore.
          old="""  const touched=new WeakMap();
            function paint(el){"""
          new="""  const touched=new WeakMap();
            const touchedEls=new Set();
            function paint(el){"""
          rep(old,new,"palette touched set",1)
          rep(
          """    if(changed)touched.set(el,rec);
            }
            function restore(el){""",
          """    if(changed){touched.set(el,rec);touchedEls.add(el)}
            }
            function restore(el){""",
          "palette track touched",1)
          rep(
          """    touched.delete(el);
            }
            function sweep(){
              const all=[document.body,...document.body.querySelectorAll('*')];
              if(isOn()) all.forEach(paint); else all.forEach(restore);
            }""",
          """    touched.delete(el);touchedEls.delete(el);
            }
            function sweep(){
              if(!document.body)return;
              if(isOn()){
                paint(document.body);
                document.body.querySelectorAll('*').forEach(paint);
              }else{
                Array.from(touchedEls).forEach(restore);
              }
            }""",
          "palette efficient restore",1)

          # Canonical switch: instant root/class paint, no legacy light DOM repaint.
          rep(
          """  html.dataset.yardivoMainTheme=theme;
            html.dataset.theme=theme;
            html.dataset.yardivoTheme=theme;
            html.classList.toggle('light-mode',theme==='light');
            html.classList.toggle('dark-mode',theme==='dark');
            body.classList.toggle('light-mode',theme==='light');
            body.classList.toggle('dark-mode',theme==='dark');
            body.classList.remove('yardivo-light-green');

            paintSwitch(theme);

            /* Keep only dark appearance controller synchronized; it must never toggle main theme. */
            try{window.YardivoSimpleTheme?.apply?.()}catch(_){}
            try{window.YardivoDarkPaletteIsolation?.apply?.()}catch(_){}
            if(theme==='light'){
              try{window.YardivoAbsoluteWhite?.apply?.()}catch(_){}
            }""",
          """  html.classList.add('yardivo-theme-switching');
            html.dataset.yardivoMainTheme=theme;
            html.dataset.theme=theme;
            html.dataset.yardivoTheme=theme;
            html.style.colorScheme=theme;
            html.classList.toggle('light-mode',theme==='light');
            html.classList.toggle('dark-mode',theme==='dark');
            body.classList.toggle('light-mode',theme==='light');
            body.classList.toggle('dark-mode',theme==='dark');
            body.classList.remove('yardivo-light-green');

            paintSwitch(theme);

            /* Synchronize small controllers only; light paint is CSS-only. */
            try{window.YardivoSimpleTheme?.apply?.()}catch(_){}
            try{window.YardivoDarkPaletteIsolation?.apply?.()}catch(_){}
            requestAnimationFrame(()=>requestAnimationFrame(()=>html.classList.remove('yardivo-theme-switching')));""",
          "canonical fast apply",1)

          # Right drawer users use canonical owner. Dark palette work runs only in dark mode.
          old="""function applyTheme(theme){
            theme=theme==='light'?'light':'dark';
            try{
              localStorage.setItem(THEME_KEY,theme);
              localStorage.setItem('yardivo_theme_v3',theme);
              localStorage.setItem('yardivo_theme_v2',theme);
              localStorage.setItem('yardivo_theme',theme);
              localStorage.setItem('theme',theme);
            }catch(_){}
            const html=document.documentElement,body=document.body;
            html.dataset.yardivoMainTheme=theme;
            html.dataset.theme=theme;
            html.dataset.yardivoTheme=theme;
            html.classList.toggle('light-mode',theme==='light');
            html.classList.toggle('dark-mode',theme==='dark');
            body.classList.toggle('light-mode',theme==='light');
            body.classList.toggle('dark-mode',theme==='dark');
            body.classList.remove('yardivo-light-green');
            try{window.YardivoSimpleTheme?.apply?.()}catch(_){}
            try{window.YardivoDarkPaletteIsolation?.apply?.()}catch(_){}
            if(theme==='light'){try{window.YardivoAbsoluteWhite?.apply?.()}catch(_){}}
            applyPalette(paletteValue());
            updateThemePaletteVisibility();
          }"""
          new="""function applyTheme(theme){
            theme=theme==='light'?'light':'dark';
            if(window.YardivoMainTheme?.apply){
              window.YardivoMainTheme.apply(theme,true);
            }else{
              try{
                localStorage.setItem(THEME_KEY,theme);
                localStorage.setItem('yardivo_theme_v3',theme);
                localStorage.setItem('yardivo_theme_v2',theme);
                localStorage.setItem('yardivo_theme',theme);
                localStorage.setItem('theme',theme);
              }catch(_){}
              const html=document.documentElement,body=document.body;
              html.dataset.yardivoMainTheme=theme;html.dataset.theme=theme;html.dataset.yardivoTheme=theme;
              html.style.colorScheme=theme;
              html.classList.toggle('light-mode',theme==='light');html.classList.toggle('dark-mode',theme==='dark');
              body.classList.toggle('light-mode',theme==='light');body.classList.toggle('dark-mode',theme==='dark');
              body.classList.remove('yardivo-light-green');
            }
            if(theme==='dark')applyPalette(paletteValue());
            updateThemePaletteVisibility();
          }"""
          rep(old,new,"drawer canonical theme",1)

          # Add transition/repaint hardening CSS. Only active during the 2-frame switch.
          marker='''<style id="yardivo-v15-qa-smooth-theme">
          html.yardivo-theme-switching *,
          html.yardivo-theme-switching *::before,
          html.yardivo-theme-switching *::after{
            transition:none!important;
          }
          html[data-yardivo-main-theme="light"] body{
            color-scheme:light;
          }
          html[data-yardivo-main-theme="dark"] body{
            color-scheme:dark;
          }
          /* Prevent expensive blur recomposition in light chrome; visual function is unchanged. */
          html[data-yardivo-main-theme="light"] body :is(.topbar,.top-bar,.app-header,.header-bar,.sidebar){
            backdrop-filter:none!important;
            -webkit-backdrop-filter:none!important;
          }
          </style>
          <script id="yardivo-v15-qa-smooth-theme-marker">
          window.YARDIVO_DEV_BUILD='20260923-v5.8.3-qa-smooth-theme-v15';
          </script>
          '''
          if '</body>' not in s: raise SystemExit("body close not found")
          s=s.replace('</body>',marker+'\n</body>',1)

          # Bump the latest v14 marker while preserving notification fix.
          s=s.replace('20260923-v5.8.3-notification-hygiene-v14','20260923-v5.8.3-qa-smooth-theme-v15')

          required=[
            'qa-smooth-theme-v15',
            'yardivo-v15-qa-smooth-theme',
            'const touchedEls=new Set()',
            'window.YardivoLightFullWhiteV5={apply}',
            "if(theme==='dark')applyPalette(paletteValue())",
            "requestAnimationFrame(()=>requestAnimationFrame(()=>html.classList.remove('yardivo-theme-switching')))"
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit("verification missing: "+", ".join(missing))

          # Explicit regression guard: old expensive light full-DOM paint must be gone.
          light_block=re.search(r'<script id="yardivo-light-full-white-v5-js">(.*?)</script>',s,re.S)
          if not light_block: raise SystemExit("light block missing")
          if "getComputedStyle" in light_block.group(1) or "querySelectorAll('*')" in light_block.group(1) or "MutationObserver" in light_block.group(1):
              raise SystemExit("expensive light runtime still present")

          p.write_text(s,encoding="utf-8")
          print("Applied YARDIVO v15 QA + smooth theme hardening")

      - name: Validate inline JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",s,flags=re.S|re.I)
          failures=[]; checked=0
          for i,code in enumerate(scripts,1):
              if not code.strip(): continue
              with tempfile.NamedTemporaryFile("w",suffix=".js",encoding="utf-8",delete=False) as f:
                  f.write(code); name=f.name
              r=subprocess.run(["node","--check",name],capture_output=True,text=True)
              checked+=1
              if r.returncode: failures.append((i,r.stderr[:1200]))
          print(f"node --check: {checked} inline scripts checked")
          if failures:
              for i,e in failures[:10]: print(f"SCRIPT {i} FAILED\n{e}")
              sys.exit(1)

      - name: Static QA regression checks
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          checks={
            "notification fix":"function normalizeDock(v)",
            "supplier guard":"warehouseBookingState",
            "master key":"yardivo_master_data_registry_v583",
            "delay settings":"yardivo_delay_settings_v1",
            "scope backend":"yardivo-user-scope",
            "supplier availability":"yardivo-supplier-availability",
            "light CSS authority":"yardivo-light-full-white-v5",
            "startup shield":"yardivo-no-dashboard-flash-after-welcome",
          }
          missing=[name for name,needle in checks.items() if needle not in s]
          if missing: raise SystemExit("Regression check failed: "+", ".join(missing))
          print("Static QA guards PASS:", ", ".join(checks))

      - name: Commit updated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "YARDIVO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy YARDIVO v15 QA and smooth light mode"
          git push origin HEAD:main
