name: YARDIVO structure QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate modular web structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,sys

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          errors=[]

          # Keep the HTML shell from becoming monolithic again.
          size=len(s.encode("utf-8"))
          if size > 500000:
              errors.append(f"index.html too large: {size} bytes (budget 500 KB)")

          # No active inline CSS: only deliberately disabled media=not all blocks may remain.
          for m in re.finditer(r'<style([^>]*)>([\s\S]*?)</style>',s,re.I):
              if not re.search(r'\bmedia=["\']not all["\']',m.group(1),re.I):
                  errors.append("active inline <style> block found; move it to styles/")

          # No large inline JavaScript.
          seen_ids=set()
          for m in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>',s,re.I):
              attrs,body=m.group(1),m.group(2)
              im=re.search(r'\bid=["\']([^"\']+)',attrs,re.I)
              if im:
                  sid=im.group(1)
                  if sid in seen_ids: errors.append(f"duplicate script id: {sid}")
                  seen_ids.add(sid)
              tm=re.search(r'\btype=["\']([^"\']+)',attrs,re.I)
              typ=(tm.group(1).lower() if tm else "")
              if typ in ("application/yardivo-retired","application/x-yardivo-disabled","text/plain"):
                  errors.append(f"retired/disabled script left in index: {im.group(1) if im else typ}")
              if not re.search(r'\bsrc\s*=',attrs,re.I) and len(body) >= 3500:
                  errors.append(f"oversized inline script remains: {im.group(1) if im else 'anonymous'} ({len(body)} chars)")

          # Every local runtime asset referenced by index must exist.
          refs=set(re.findall(r'(?:src|href)=["\']([^"\']+)["\']',s,re.I))
          for ref in sorted(refs):
              clean=ref.split('?',1)[0].split('#',1)[0]
              if not clean or clean.startswith(('http://','https://','//','data:','#','mailto:','tel:')):
                  continue
              if not Path(clean).exists():
                  errors.append(f"missing local asset: {clean}")

          # Module manifest must match files on disk.
          mf=Path("app/module-manifest.json")
          if not mf.exists():
              errors.append("missing app/module-manifest.json")
          else:
              data=json.loads(mf.read_text(encoding="utf-8"))
              for item in data.get("scripts",[]):
                  q=Path(item["path"])
                  if not q.exists():
                      errors.append(f"manifest file missing: {q}")

          # Known high-frequency network polling patterns that previously caused egress.
          js="\n".join(x.read_text(encoding="utf-8",errors="ignore") for root in (Path("modules"),Path("services")) if root.exists() for x in root.rglob("*.js"))
          banned=[
              "setInterval(poll,1500)",
              "setInterval(refreshNow,1500)",
              "},2300);"
          ]
          for pat in banned:
              if pat in js:
                  errors.append(f"banned legacy polling pattern returned: {pat}")

          if errors:
              print("\n".join("ERROR: "+x for x in errors))
              sys.exit(1)

          print({
              "index_bytes":size,
              "script_ids":len(seen_ids),
              "manifest_scripts":len(json.loads(mf.read_text())["scripts"])
          })
          PY

      - name: Syntax check external JavaScript
        run: |
          find modules services -name '*.js' -print0 2>/dev/null | xargs -0 -r -n1 node --check
