name: Login Spinner Patch
permissions:
  contents: write
on:
  push:
    paths:
      - .github/workflows/yardivo-login-spinner.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="  b.textContent=on?'PROVJERA…':b.dataset.normalText;\n  b.disabled=!!on;"
          new="  b.innerHTML=on?'<span class=\\\"yv-login-spinner\\\" aria-hidden=\\\"true\\\"></span><span>PROVJERA…</span>':b.dataset.normalText;\n  b.classList.toggle('yv-login-busy',!!on);\n  b.disabled=!!on;"
          if old not in s:
              raise SystemExit("setBusy anchor missing")
          s=s.replace(old,new,1)
          style='''<style id="yardivo-v583-login-spinner-20260924">
          #loginSubmitBtn.yv-login-busy{display:flex!important;align-items:center!important;justify-content:center!important;gap:10px!important}
          #loginSubmitBtn .yv-login-spinner{width:18px!important;height:18px!important;border:3px solid rgba(255,255,255,.35)!important;border-top-color:#fff!important;border-radius:50%!important;flex:0 0 18px!important;animation:yardivoLoginSpin .75s linear infinite!important}
          @keyframes yardivoLoginSpin{to{transform:rotate(360deg)}}
          </style>
          '''
          if 'yardivo-v583-login-spinner-20260924' not in s:
              pos=s.find('</head>')
              if pos<0: raise SystemExit("head missing")
              s=s[:pos]+style+s[pos:]
          p.write_text(s,encoding="utf-8")
          m=re.search(r'<script[^>]+id="yardivo-canonical-login-router-v2-20260901"[^>]*>(.*?)</script>',s,re.S)
          if not m: raise SystemExit("login script missing")
          Path("/tmp/login.js").write_text(m.group(1),encoding="utf-8")
          subprocess.check_call(["node","--check","/tmp/login.js"])
          PY
          git diff --check
      - name: Commit
        run: |
          rm .github/workflows/yardivo-login-spinner.yml
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-login-spinner.yml
          git diff --cached --check
          git commit -m "Add visible login verification spinner"
          git push origin HEAD:main
