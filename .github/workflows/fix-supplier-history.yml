name: Fix supplier history backend authority
on:
  push:
    paths:
      - ".github/workflows/fix-supplier-history.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch supplier history
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="""async function pullSupplier(){
            if(!supplier())return;
            const rowsRaw=await call('list_mine');
            const cleanEpoch=Date.parse(localStorage.getItem('yardivo_clean_epoch_v583')||'')||0;
            const rows=(Array.isArray(rowsRaw)?rowsRaw:[]).filter(x=>!cleanEpoch||Date.parse(x?.created_at||x?.updated_at||0)>=cleanEpoch);
            if(!Array.isArray(rows))return;"""
          new="""async function pullSupplier(){
            if(!supplier())return;
            const rowsRaw=await call('list_mine');
            /* Supabase supplier_deliveries is authoritative for Supplier history.
               A browser-local cleanup timestamp must never hide a valid server row. */
            const rows=Array.isArray(rowsRaw)?rowsRaw:[];
            if(!Array.isArray(rows))return;"""
          if old not in s:
              raise SystemExit("pullSupplier target block not found")
          s=s.replace(old,new,1)

          marker="""window.addEventListener('yardivo:login',()=>setTimeout(syncNow,250));"""
          inject="""window.addEventListener('yardivo:login',()=>setTimeout(syncNow,250));
          document.addEventListener('click',e=>{
            if(!supplier())return;
            const b=e.target.closest?.('#yardivoSupplierPortal [data-ysp-view="history"],#yardivoSupplierPortal [data-ysp-view="status"]');
            if(b)setTimeout(()=>pullSupplier().catch(err=>console.error('Supplier history refresh',err)),30);
          },true);"""
          if marker not in s:
              raise SystemExit("supplier login sync marker not found")
          s=s.replace(marker,inject,1)

          s=s.replace("20260923-v5.8.3-qa-smooth-theme-v15","20260923-v5.8.3-supplier-history-backend-v16")
          if "supplier-history-backend-v16" not in s:
              s=s.replace("</body>","<script>window.YARDIVO_DEV_BUILD='20260923-v5.8.3-supplier-history-backend-v16';</script>\n</body>",1)

          required=[
            "Supabase supplier_deliveries is authoritative for Supplier history",
            "data-ysp-view=\"history\"",
            "pullSupplier().catch",
            "supplier-history-backend-v16"
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit("Missing: "+", ".join(missing))
          p.write_text(s,encoding="utf-8")
          print("Supplier history backend authority patched")
      - name: Validate inline JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess,tempfile,sys
          s=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",s,re.S|re.I)
          checked=0
          for i,code in enumerate(scripts,1):
            if not code.strip(): continue
            with tempfile.NamedTemporaryFile("w",suffix=".js",encoding="utf-8",delete=False) as f:
              f.write(code); name=f.name
            r=subprocess.run(["node","--check",name],capture_output=True,text=True)
            checked+=1
            if r.returncode:
              print("FAILED script",i,r.stderr);sys.exit(1)
          print("PASS",checked,"inline scripts")
      - name: Commit
        shell: bash
        run: |
          git config user.name "YARDIVO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix supplier history backend authority"
          git push origin HEAD:main
