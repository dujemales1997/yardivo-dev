name: YARDIVO final runtime cleanup
on:
  push:
    paths:
      - ".github/workflows/yardivo-final-runtime-cleanup.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch remaining network poll
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="setInterval(()=>{if(!document.hidden&&['admin','gate'].includes(role()))loadGate()},7000);"
          new="""/* Event listeners are primary; 30 s is only a visible-tab safety fallback. */
          setInterval(()=>{if(!document.hidden&&['admin','gate'].includes(role()))loadGate()},30000);"""
          if s.count(old)!=1:
              raise SystemExit(f"self-gate poll: expected 1 match, got {s.count(old)}")
          s=s.replace(old,new)
          p.write_text(s,encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "YARDIVO Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Reduce final Self Gate polling fallback [skip ci]"
          git push
