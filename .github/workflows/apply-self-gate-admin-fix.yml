name: Apply Self Gate Admin Fix
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/fix_self_gate_admin.py"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch index
        run: python .github/scripts/fix_self_gate_admin.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s=Path("index.html").read_text(encoding="utf-8")
          required=["yardivo-self-gate-admin-buttons-v2","function copyTextSafe(text)","function ensureWallQrModal()","function showWallQr(publicUrl,locationName)","setWallButtons(true,false)","function normalizeDock(v)","warehouseBookingState"]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit("Missing: "+", ".join(missing))
          scripts=re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>",s,re.S|re.I)
          checked=0
          for i,code in enumerate(scripts,1):
              if not code.strip(): continue
              with tempfile.NamedTemporaryFile("w",suffix=".js",delete=False,encoding="utf-8") as f:
                  f.write(code); name=f.name
              r=subprocess.run(["node","--check",name],capture_output=True,text=True)
              checked+=1
              if r.returncode:
                  print("FAILED SCRIPT",i,r.stderr)
                  sys.exit(1)
          print("PASS",checked,"inline scripts")
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "YARDIVO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Admin Self Gate QR controls"
          git push origin HEAD:main
