name: YARDIVO quick reclassify refactor branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reclassify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modular-webapp-20260925
          fetch-depth: 0
      - name: Reclassify ownership
        run: python3 scripts/reclassify_phase1.py
      - name: Syntax QA
        run: find modules services -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app modules services
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Organize YARDIVO runtime by feature ownership [skip ci]"
          git push origin HEAD:refactor/modular-webapp-20260925
