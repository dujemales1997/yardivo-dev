name: YARDIVO refactor ownership and browser QA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  qa-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modular-webapp-20260925
          fetch-depth: 0

      - name: Reclassify generated modules
        run: python3 scripts/reclassify_phase1.py

      - name: Syntax check all extracted JavaScript
        run: |
          set -e
          find modules services -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Static structural QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          m=json.loads(Path('app/module-manifest.json').read_text())
          assert len(s.encode()) < 3000000
          assert len(m['scripts']) >= 100
          assert Path('styles/yardivo-runtime.css').stat().st_size > 900000
          assert 'services/yardivo-online-sync-v2-20260902.js?v=20260925' in s
          assert 'modules/supplier/yardivo-v560-supplier-live-sync.js?v=20260925' in s
          assert 'modules/master-data/yardivo-master-data-registry-final-v583.js?v=20260925' in s
          assert 'modules/chat/yardivo-v583-operational-chat.js?v=20260925' in s
          assert 'modules/chat/yardivo-v583-help-chat-js.js?v=20260925' in s
          assert 'modules/gate/yardivo-self-gate-pass-v1.js?v=20260925' in s
          assert 'modules/receiving/yardivo-receiving-header-warehouse-qr-v583.js?v=20260925' in s
          assert 'async src="modules/' not in s and 'defer src="modules/' not in s
          # all local src/href targets exist
          refs=set(re.findall(r'(?:src|href)=["\']([^"\']+)["\']',s,re.I))
          missing=[]
          for ref in refs:
              clean=ref.split('?',1)[0].split('#',1)[0]
              if not clean or clean.startswith(('http://','https://','//','data:','#','mailto:','tel:')): continue
              if not Path(clean).exists(): missing.append(clean)
          assert not missing, missing[:20]
          print({'index_bytes':len(s.encode()),'scripts_externalized':len(m['scripts']),'css_bytes':Path('styles/yardivo-runtime.css').stat().st_size})
          PY

      - name: Prepare original baseline
        run: git show origin/main:index.html > baseline.html

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser smoke compare original vs modular
        run: |
          cat > qa-smoke.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:1440,height:1000}});
          async function inspect(path){
            const page = await context.newPage();
            const badLocal=[];
            const pageErrors=[];
            page.on('response',r=>{
              try{
                const u=new URL(r.url());
                if(u.hostname==='127.0.0.1' && r.status()>=400) badLocal.push({url:u.pathname,status:r.status()});
              }catch{}
            });
            page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:8765/'+path,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(1800);
            const snap=await page.evaluate(()=>({
              title:document.title,
              bodyClass:document.body?.className||'',
              ids:[...document.querySelectorAll('[id]')].map(x=>x.id).filter(Boolean).sort(),
              buttons:document.querySelectorAll('button').length,
              inputs:document.querySelectorAll('input').length,
              sections:document.querySelectorAll('section').length,
              scripts:document.scripts.length,
              text:(document.body?.innerText||'').replace(/\s+/g,' ').trim().slice(0,1000)
            }));
            await page.close();
            return {snap,badLocal,pageErrors};
          }

          const base=await inspect('baseline.html');
          const mod=await inspect('index.html');

          if(mod.badLocal.length) throw new Error('Modular local asset failures: '+JSON.stringify(mod.badLocal.slice(0,20)));
          const baseIds=new Set(base.snap.ids), modIds=new Set(mod.snap.ids);
          const missing=[...baseIds].filter(x=>!modIds.has(x));
          if(missing.length) throw new Error('Missing DOM ids after modularization: '+missing.slice(0,30).join(', '));
          if(base.snap.title!==mod.snap.title) throw new Error('Title mismatch');
          if(Math.abs(base.snap.buttons-mod.snap.buttons)>2) throw new Error('Button count changed too much');
          if(Math.abs(base.snap.inputs-mod.snap.inputs)>2) throw new Error('Input count changed too much');
          if(Math.abs(base.snap.sections-mod.snap.sections)>2) throw new Error('Section count changed too much');

          console.log(JSON.stringify({
            baseline:{title:base.snap.title,ids:base.snap.ids.length,buttons:base.snap.buttons,inputs:base.snap.inputs,sections:base.snap.sections,pageErrors:base.pageErrors.slice(0,10)},
            modular:{title:mod.snap.title,ids:mod.snap.ids.length,buttons:mod.snap.buttons,inputs:mod.snap.inputs,sections:mod.snap.sections,pageErrors:mod.pageErrors.slice(0,10)}
          },null,2));
          await browser.close();
          JS
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/yardivo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node qa-smoke.mjs

      - name: Commit verified ownership structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app modules services styles docs
          if git diff --cached --quiet; then
            echo "No ownership changes"
            exit 0
          fi
          git commit -m "Organize YARDIVO runtime by feature ownership [skip ci]"
          git push origin HEAD:refactor/modular-webapp-20260925
