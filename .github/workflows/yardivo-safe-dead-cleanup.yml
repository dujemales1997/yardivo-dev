name: YARDIVO safe dead-code cleanup
on:
  push:
    paths:
      - ".github/workflows/yardivo-safe-dead-cleanup.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove dead runtime layers
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          before=len(s)

          ids=[
            "yardivo-live-yard-digital-twin-v1","yardivo-live-yard-tv-v5","yardivo-live-yard-v5-4-dock-clean",
            "yardivo-real-webgl-yard-v1","yardivo-native-yard-v3","yardivo-v572-supplier-approval-bridge",
            "yardivo-v573-supplier-request-notification-fix","yardivo-inventory-supplier-active-warehouse-final-v583",
            "yardivo-v583-master-header-location-capacity-authority","yardivo-v583-supplier-linear-announcement-inventory-authority",
            "yardivo-v583-supplier-canonical-master-ramps-map-final","yardivo-v583-supplier-announcement-total-authority",
            "yardivo-v583-supplier-no-flicker-canonical-authority","yardivo-v583-supplier-center-calendar-authority",
            "yardivo-v583-supplier-premium-ux-final-authority","yardivo-v583-shared-ramp-hours-centered-supplier-map-authority",
            "yardivo-v583-supplier-true-location-placeholder-authority","yardivo-v583-supplier-single-authority-final",
            "yardivo-v583-supplier-right-map-final","yardivo-v583-supplier-inventory-style-authority",
            "yardivo-v583-supplier-rebuilt-zero-authority","yardivo-v583-capacity-visible-all-sections-authority",
            "yardivo-v583-supplier-daily-map-after-date-final","yardivo-v583-location-dropdowns-master-binding-final",
            "yardivo-v583-master-popup-admin-final","yardivo-v583-supplier-popup-header-multiwarehouse-final-authority",
            "yardivo-v583-settings-master-deep-structure-final-js","yardivo-v583-master-dwell-single-section-final-js",
            "yardivo-v583-master-single-owner-smart-settings-final-js","yardivo-v583-settings-master-exact-contract-js",
            "yardivo-v583-admin-role-master-entry-authoritative-js","yardivo-v583-settings-ordinary-visible-master-isolated-js",
            "yardivo-v583-master-close-x-fix-js","yardivo-v583-login-always-home-menu-final-js",
            "yardivo-v583-settings-single-page-master-first-js","yardivo-v583-admin-home-context-settings-authority-js",
            "yardivo-v583-wh-time-supplier-calendar-hotfix-final","yardivo-v583-supplier-booking-wizard-final",
            "yardivo-v583-supplier-step-unlock-hotfix","yardivo-v583-supplier-inbox-visibility-final-authority",
            "yardivo-v583-inventory-supplier-inbox-notification-final-authority","yardivo-v583-supabase-connection-watchdog-final",
            "yardivo-v583-inventory-supplierrequests-rbac-final-guard","yardivo-v583-inventory-supplier-filter-authority-final",
            "yardivo-v583-supplier-qr-history-live-20260923",
            "yardivo-v575-build-marker","yardivo-v576-build-marker","yardivo-v582-build-marker",
            "yardivo-v583-final-integrity-marker","yardivo-stability-hard-fix-marker-v1","yardivo-v583-supplier-stability-marker",
            "yardivo-v583-supplier-inbox-master-persistence-recovery-final","yardivo-v583-supplier-global-scope-connected-final",
            "yardivo-v583-master-warehouse-dropdown-config-fix-marker","yardivo-v583-supplier-visible-warehouse-name-only-marker",
            "yardivo-v583-master-full-warehouse-config-marker","yardivo-v583-fullstack-reset-supplier-accounts-final-marker",
            "yardivo-v583-supplier-calendar-strictmode-fix-marker","yardivo-v583-supplier-map-fullscreen-duration-weekend-marker",
            "yardivo-v583-qr-switch-scanner-only-marker","yardivo-v583-no-flicker-bell-qr-whname-marker",
            "yardivo-v583-inbox-no-flicker-root-permission-marker","yardivo-v583-inventory-ui-master-names-final-marker",
            "yardivo-v583-supabase-inbox-stable-final-marker","yardivo-v583-notification-delete-filter-final-marker",
            "yardivo-v583-deep-ui-stability-notif-delete-final-marker","yardivo-v583-notification-sidebar-smooth-final-marker",
            "yardivo-analytics-build-marker","yardivo-v15-qa-smooth-theme-marker","yardivo-self-gate-admin-buttons-v2",
            "yardivo-qr-role-server-confirm-v587"
          ]
          removed=[]
          missing=[]
          for script_id in ids:
              pat=re.compile(r'<script\\b[^>]*\\bid=["\\\']'+re.escape(script_id)+r'["\\\'][^>]*>[\\s\\S]*?</script>\\s*',re.I)
              s2,n=pat.subn('',s,count=1)
              if n:
                  s=s2; removed.append(script_id)
              else:
                  missing.append(script_id)

          swaps=[
            ("chatTimer=setInterval(()=>{if(opened)loadMessages(true)},2500)","chatTimer=setInterval(()=>{if(opened)loadMessages(true)},10000)"),
            ("badgeTimer=setInterval(pollBadge,6000)","badgeTimer=setInterval(pollBadge,30000)"),
            ("timer=setInterval(poll,3500)","timer=setInterval(poll,30000)"),
            ("timer=setInterval(()=>{if(opened)refreshThreads(false).then(loadMessages)},3000)","timer=setInterval(()=>{if(opened)refreshThreads(false).then(loadMessages)},10000)"),
            ("setInterval(()=>{if(!document.hidden&&!opened)refreshThreads(true)},4000)","setInterval(()=>{if(!document.hidden&&!opened)refreshThreads(true)},30000)")
          ]
          changed=0
          for old,new in swaps:
              if old in s:
                  s=s.replace(old,new,1); changed+=1

          p.write_text(s,encoding="utf-8")
          print("removed scripts:",len(removed),"missing:",len(missing),"poll swaps:",changed,"bytes:",before,"->",len(s))
      - name: Verify cleanup
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert '<script id="yardivo-early-session">' in s
          assert 'setInterval(refreshNow,1500)' not in s
          assert 'yardivo-v583-supplier-qr-history-live-20260923' not in s
          print("safe cleanup verified")
      - name: Commit
        run: |
          git config user.name "YARDIVO Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove retired YARDIVO layers and duplicate pollers [skip ci]"
          git push
