name: Fix multi-window login isolation
on:
  push:
    paths:
      - ".github/workflows/yardivo-login-isolation.yml"
      - ".github/scripts/patch_login_isolation.py"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_login_isolation.py
      - run: |
          rm .github/workflows/yardivo-login-isolation.yml
          rm .github/scripts/patch_login_isolation.py
          git config user.name "YARDIVO QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/yardivo-login-isolation.yml .github/scripts/patch_login_isolation.py
          git diff --cached --check
          git commit -m "Fix multi-window login isolation"
          git push origin HEAD:main
