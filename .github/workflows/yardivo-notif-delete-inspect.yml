name: Inspect supplier notifications and delete action
on:
  push:
    paths:
      - ".github/workflows/yardivo-notif-delete-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8",errors="replace")
          needles=[
            "yardivo_live_notifications_v1",
            "YardivoNotifications",
            "notification",
            "bell",
            "Najave dobavljača",
            "NAJAVE DOBAVLJAČA",
            "data-v583-approve-request",
            "data-v580-reject",
            "yardivoSupplierContextMenuV583",
            "Supplier najava"
          ]
          for n in needles:
              print("\n"+"="*24+" "+n+" "+"="*24)
              start=0;found=0
              while True:
                  i=s.lower().find(n.lower(),start)
                  if i<0: break
                  found+=1
                  print(f"--- match {found} @ {i} ---")
                  print(s[max(0,i-7000):min(len(s),i+14000)])
                  start=i+len(n)
                  if found>=10: break
              if not found: print("NO MATCH")
