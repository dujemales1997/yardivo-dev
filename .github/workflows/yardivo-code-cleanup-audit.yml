name: Audit legacy YARDIVO blocks
on:
  push:
    paths:
      - ".github/workflows/yardivo-code-cleanup-audit.yml"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit monolith
        shell: python
        run: |
          from pathlib import Path
          import re, collections
          p=Path("index.html")
          s=p.read_text(encoding="utf-8",errors="replace")
          print("INDEX_BYTES",len(s.encode("utf-8")))
          blocks=[]
          for typ in ("script","style"):
            for m in re.finditer(r"<"+typ+r"\b([^>]*)>(.*?)</"+typ+r">",s,re.S|re.I):
              attrs,body=m.group(1),m.group(2)
              mi=re.search(r'\bid=["\']([^"\']+)["\']',attrs,re.I)
              bid=mi.group(1) if mi else ""
              blocks.append((typ,bid,len(m.group(0).encode("utf-8")),m.start(),body))
          ids=[b[1] for b in blocks if b[1]]
          dup=[(k,v) for k,v in collections.Counter(ids).items() if v>1]
          print("BLOCKS",len(blocks),"WITH_ID",len(ids),"DUP_IDS",dup)
          print("\nTOP_80_BLOCKS")
          for typ,bid,size,pos,body in sorted(blocks,key=lambda x:x[2],reverse=True)[:80]:
              flags=[]
              low=(bid+" "+body[:1200]).lower()
              for f in ["legacy","old","retire","disabled","obsolete","deprecated","handover","fix","authority","final","migration","compat"]:
                  if f in low: flags.append(f)
              print(f"{size:8d} {typ:6s} {bid[:90]} FLAGS={','.join(flags)}")
          print("\nSUSPICIOUS_IDS")
          for typ,bid,size,pos,body in blocks:
              low=bid.lower()
              if any(k in low for k in ["legacy","old","retire","handover","migration","compat","fix","authority","final","disabled","zero-state"]):
                  print(f"{size:8d} {typ:6s} {bid}")
          print("\nKNOWN_GUARD_PATTERNS")
          pats=[
            "__YARDIVO_SUPPLIER_HISTORY_STATUS_SERVER_AUTH_20260923__",
            "__YARDIVO_SUPPLIER_NO_FLICKER_FINAL_20260923__",
            "yardivo-v583-supplier-qr-history-live-20260923",
            "yardivo-v583-handover-production-empty-final",
            "yardivo-zero-state-bootstrap-v583",
            "yardivo-v583-announcement-number-display-20260923"
          ]
          for pat in pats:
              print(pat, s.count(pat))
