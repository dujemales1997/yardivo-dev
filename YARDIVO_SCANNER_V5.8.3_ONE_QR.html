<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050806">
<title>YARDIVO · ONE QR Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#050806;--panel:#0b120e;--panel2:#0e1712;--line:#20352a;
  --text:#eef8f1;--muted:#8ba497;--green:#54f28b;--green2:#1ec96a;
  --red:#ff6b74;--yellow:#ffd56a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 14px calc(16px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px}
.brand h1{font-size:18px;margin:0;letter-spacing:.04em}
.brand small{color:var(--green);font-weight:900}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 14px 40px rgba(0,0,0,.26)}
label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin:10px 0 6px}
input,select,button{font:inherit}
input,select{width:100%;padding:13px 12px;border-radius:12px;border:1px solid #294435;background:#07100b;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(84,242,139,.08)}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:950;cursor:pointer}
button.primary{background:var(--green);color:#041008}
button.secondary{background:#132019;color:var(--text);border:1px solid #294435}
button.danger{background:#31171a;color:#ffc5c8;border:1px solid #6b2d33}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 180px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900}
.dot{width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 14px rgba(255,213,106,.5)}
.status.ok .dot{background:var(--green);box-shadow:0 0 14px rgba(84,242,139,.55)}
.status.bad .dot{background:var(--red);box-shadow:0 0 14px rgba(255,107,116,.5)}
.hidden{display:none!important}
#reader{width:100%;overflow:hidden;border-radius:16px;background:#000;min-height:280px}
#reader video{object-fit:cover}
.hero{text-align:center;padding:8px 0 2px}
.hero strong{display:block;font-size:20px}
.hero span{color:var(--muted);font-size:12px}
.result{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.fact{border:1px solid #21382b;border-radius:12px;padding:10px;background:#08110c}
.fact small{display:block;color:var(--muted);font-size:9px;font-weight:800;margin-bottom:3px}
.fact strong{font-size:13px;word-break:break-word}
.msg{padding:11px 12px;border-radius:12px;border:1px solid #5a4720;background:#251e0b;color:#ffe8a4;font-size:12px;font-weight:800;line-height:1.45}
.msg.ok{border-color:#245d3a;background:#0b2115;color:#a5f5bf}
.msg.bad{border-color:#6a2e34;background:#2a1115;color:#ffc0c5}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rolepill{font-size:10px;font-weight:950;color:#aef5c4;background:#0d2416;border:1px solid #255f3b;padding:7px 9px;border-radius:999px}
.footer{color:#5f7568;text-align:center;font-size:10px;padding:18px 6px}
@media(max-width:520px){.result{grid-template-columns:1fr}.brand h1{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div><h1>YARDIVO · ONE QR</h1><small>MOBILE SCANNER · V5.8.3</small></div>
    <div id="netStatus" class="status"><span class="dot"></span><span>PRIPREMA</span></div>
  </div>

  <section id="loginCard" class="card">
    <div class="hero">
      <strong>Prijava u scanner</strong>
      <span>Porta, Prijam ili Admin</span>
    </div>
    <label for="username">KORISNIČKO IME</label>
    <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="password">LOZINKA</label>
    <input id="password" type="password" autocomplete="current-password">
    <div style="height:12px"></div>
    <button id="loginBtn" class="primary" style="width:100%">PRIJAVI SE</button>
    <div id="loginMsg" class="msg bad hidden" style="margin-top:12px"></div>
  </section>

  <section id="scannerCard" class="hidden">
    <div class="card">
      <div class="toolbar">
        <div>
          <div style="font-size:11px;color:var(--muted);font-weight:800">PRIJAVLJEN</div>
          <strong id="who">—</strong>
        </div>
        <div class="row" style="flex:0 1 auto">
          <span id="rolePill" class="rolepill">—</span>
          <button id="logoutBtn" class="secondary">ODJAVA</button>
        </div>
      </div>

      <div id="adminModeWrap" class="hidden" style="margin-top:14px">
        <label for="adminMode">ADMIN SCAN NAČIN</label>
        <select id="adminMode">
          <option value="gate">PORTA · ULAZ</option>
          <option value="dock">PRIJAM · NA RAMPI</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="hero">
        <strong>Skeniraj YARDIVO QR</strong>
        <span>Kamera radi samo nakon tvoje dozvole</span>
      </div>
      <div id="reader"></div>
      <div class="row" style="margin-top:12px">
        <button id="startBtn" class="primary">UKLJUČI KAMERU</button>
        <button id="stopBtn" class="secondary" disabled>ZAUSTAVI</button>
      </div>
      <div id="scanMsg" class="msg hidden" style="margin-top:12px"></div>

      <details style="margin-top:12px">
        <summary style="cursor:pointer;color:var(--muted);font-size:11px;font-weight:900">RUČNI TEST TOKENA</summary>
        <label for="manualToken">QR URL ILI TOKEN</label>
        <input id="manualToken" placeholder="Zalijepi QR URL ili token">
        <button id="manualBtn" class="secondary" style="width:100%;margin-top:8px">PROVJERI</button>
      </details>
    </div>

    <div id="resultCard" class="card hidden">
      <div class="hero">
        <strong id="resultTitle">QR VALJAN</strong>
        <span id="resultSub">Provjeri podatke prije potvrde</span>
      </div>
      <div id="facts" class="result"></div>
      <div class="row" style="margin-top:14px">
        <button id="confirmBtn" class="primary">POTVRDI</button>
        <button id="cancelBtn" class="secondary">ODUSTANI</button>
      </div>
    </div>
  </section>

  <div class="footer">YARDIVO · Supabase protected scanner · ONE QR</div>
</div>

<script>
(()=>{'use strict';

const SUPABASE_URL='https://rskticdbiovvgyocpzoc.supabase.co';
const SUPABASE_KEY='sb_publishable_NWRcS2n-8GxF8qL7wXbZ-Q_-jIyfGoy';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}
});

const $=id=>document.getElementById(id);
let scope=null,currentToken='',currentValidation=null,qr=null,running=false,lastDecoded='';

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setNet(ok,text){
  const el=$('netStatus');el.className='status '+(ok?'ok':'bad');
  el.querySelector('span:last-child').textContent=text;
}
function msg(el,text,type=''){
  el.textContent=text;el.className='msg '+(type||'');el.classList.toggle('hidden',!text);
}
function role(){return String(scope?.app_role||'').toLowerCase()}
function mode(){
  if(role()==='gate')return'gate';
  if(role()==='reception')return'dock';
  return $('adminMode').value||'gate';
}
function prettyRole(r){return ({gate:'PORTA',reception:'PRIJAM',admin:'ADMIN'})[r]||String(r||'').toUpperCase()}
function tokenFromRaw(raw){
  raw=String(raw||'').trim();
  if(!raw)return'';
  try{
    const u=new URL(raw);
    const parts=u.pathname.split('/').filter(Boolean);
    const i=parts.findIndex(x=>x==='pass');
    if(i>=0&&parts[i+1])return decodeURIComponent(parts[i+1]);
  }catch(_){}
  const m=raw.match(/\/q\/pass\/([^?#\s]+)/i);
  if(m)return decodeURIComponent(m[1]);
  return raw;
}
async function invokeGate(action,payload={}){
  const {data,error}=await sb.functions.invoke('yardivo-gate-pass',{body:{action,...payload}});
  if(error){
    let text=error.message||String(error);
    try{
      const body=await error.context?.json?.();
      if(body?.error)text=body.error;
    }catch(_){}
    throw new Error(text);
  }
  if(data?.ok===false)throw new Error(data.error||'SCAN_ERROR');
  return data;
}
async function fetchScope(){
  const {data,error}=await sb.functions.invoke('yardivo-user-scope',{body:{fresh:true}});
  if(error)throw error;
  if(!data?.ok)throw new Error(data?.error||'Scope nije dostupan.');
  return data.data||{};
}
async function bootstrapSession(){
  const {data}=await sb.auth.getSession();
  if(!data?.session)return false;
  try{
    scope=await fetchScope();
    if(!['gate','reception','admin'].includes(role())){
      await sb.auth.signOut();
      throw new Error('Ovaj račun nema pravo koristiti mobilni scanner.');
    }
    showScanner();
    setNet(true,'ONLINE');
    return true;
  }catch(e){
    setNet(false,'GREŠKA');
    throw e;
  }
}
function showScanner(){
  $('loginCard').classList.add('hidden');
  $('scannerCard').classList.remove('hidden');
  $('who').textContent=scope?.username||'YARDIVO';
  $('rolePill').textContent=prettyRole(role());
  $('adminModeWrap').classList.toggle('hidden',role()!=='admin');
}
function showLogin(){
  $('scannerCard').classList.add('hidden');
  $('loginCard').classList.remove('hidden');
  $('resultCard').classList.add('hidden');
  scope=null;currentToken='';currentValidation=null;
}
async function login(){
  const username=$('username').value.trim().toLowerCase();
  const password=$('password').value;
  msg($('loginMsg'),'');
  if(!username||!password){msg($('loginMsg'),'Upiši korisničko ime i lozinku.','bad');return}
  const btn=$('loginBtn');btn.disabled=true;btn.textContent='PRIJAVA…';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:`${username}@yardivo.local`,password});
    if(error||!data?.session)throw error||new Error('Prijava nije uspjela.');
    scope=await fetchScope();
    if(!['gate','reception','admin'].includes(role())){
      await sb.auth.signOut();
      throw new Error('Ovaj račun nije Porta, Prijam ni Admin.');
    }
    showScanner();setNet(true,'ONLINE');
    msg($('scanMsg'),'Prijava uspješna. Uključi kameru i skeniraj QR.','ok');
  }catch(e){
    msg($('loginMsg'),String(e?.message||e),'bad');setNet(false,'OFFLINE');
  }finally{btn.disabled=false;btn.textContent='PRIJAVI SE'}
}
async function startCamera(){
  msg($('scanMsg'),'');
  if(running)return;
  if(!window.Html5Qrcode){msg($('scanMsg'),'QR kamera biblioteka nije učitana. Provjeri internet vezu.','bad');return}
  try{
    qr=new Html5Qrcode('reader');
    const cams=await Html5Qrcode.getCameras();
    if(!cams?.length)throw new Error('Kamera nije pronađena ili nije dopuštena.');
    const back=cams.find(c=>/back|rear|environment/i.test(c.label))||cams[cams.length-1];
    await qr.start(
      {deviceId:{exact:back.id}},
      {fps:12,qrbox:{width:240,height:240},aspectRatio:1},
      async decoded=>{
        if(decoded===lastDecoded)return;
        lastDecoded=decoded;setTimeout(()=>{lastDecoded=''},1800);
        await processRaw(decoded);
      },
      ()=>{}
    );
    running=true;$('startBtn').disabled=true;$('stopBtn').disabled=false;
    msg($('scanMsg'),'Kamera je uključena. Usmjeri je prema YARDIVO QR kodu.','ok');
  }catch(e){
    msg($('scanMsg'),String(e?.message||e),'bad');
    try{await qr?.clear?.()}catch(_){}
    qr=null;running=false;
  }
}
async function stopCamera(){
  if(!qr)return;
  try{await qr.stop()}catch(_){}
  try{await qr.clear()}catch(_){}
  qr=null;running=false;$('startBtn').disabled=false;$('stopBtn').disabled=true;
}
async function processRaw(raw){
  const token=tokenFromRaw(raw);
  if(!token){msg($('scanMsg'),'QR token nije prepoznat.','bad');return}
  currentToken=token;currentValidation=null;
  msg($('scanMsg'),'Provjeravam QR u YARDIVO bazi…');
  try{
    const data=await invokeGate('validate',{token,type:mode()});
    currentValidation=data;
    renderValidation(data);
    msg($('scanMsg'),'QR je valjan. Provjeri podatke i potvrdi.','ok');
    if(running)await stopCamera();
  }catch(e){
    const er=String(e?.message||e);
    if(/QR_SCAN_DISABLED/i.test(er)){
      msg($('scanMsg'),'ERROR · Mobilno QR skeniranje je isključeno u YARDIVO Postavkama. Admin mora uključiti QR Scan switch za test.','bad');
    }else{
      msg($('scanMsg'),'ERROR · '+er,'bad');
    }
    $('resultCard').classList.add('hidden');
  }
}
function renderValidation(d){
  const isGate=mode()==='gate';
  $('resultTitle').textContent='QR VALJAN';
  $('resultSub').textContent=isGate?'Porta · potvrda ulaza':'Prijam · potvrda dolaska na rampu';
  const facts=[
    ['DOBAVLJAČ',d.supplier||'—'],
    ['LOKACIJA',d.locationName||d.location||'—'],
    ['SKLADIŠTE',d.warehouse||'—'],
    ['TERMIN',d.time||'—'],
    ['RAMPA',d.dock||'—'],
    ['STATUS',d.status||'—']
  ];
  $('facts').innerHTML=facts.map(([k,v])=>`<div class="fact"><small>${esc(k)}</small><strong>${esc(v)}</strong></div>`).join('');
  $('confirmBtn').textContent=isGate?'POTVRDI ULAZ':'POTVRDI NA RAMPI';
  $('resultCard').classList.remove('hidden');
}
async function confirmScan(){
  if(!currentToken||!currentValidation)return;
  const action=mode()==='gate'?'arrival':'dock';
  const btn=$('confirmBtn');btn.disabled=true;btn.textContent='SPREMAM…';
  try{
    const data=await invokeGate(action,{token:currentToken,type:mode()});
    msg($('scanMsg'),action==='arrival'?'USPJEH · Vozilo je evidentirano kao U DVORIŠTU.':'USPJEH · Vozilo je evidentirano NA RAMPI.','ok');
    $('resultCard').classList.add('hidden');
    currentToken='';currentValidation=null;
    setTimeout(()=>startCamera(),900);
  }catch(e){
    const er=String(e?.message||e);
    if(/QR_SCAN_DISABLED/i.test(er))msg($('scanMsg'),'ERROR · QR Scan switch je isključen u YARDIVO Postavkama.','bad');
    else msg($('scanMsg'),'ERROR · '+er,'bad');
  }finally{btn.disabled=false;btn.textContent=mode()==='gate'?'POTVRDI ULAZ':'POTVRDI NA RAMPI'}
}

$('loginBtn').onclick=login;
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('startBtn').onclick=startCamera;
$('stopBtn').onclick=stopCamera;
$('manualBtn').onclick=()=>processRaw($('manualToken').value);
$('confirmBtn').onclick=confirmScan;
$('cancelBtn').onclick=()=>{$('resultCard').classList.add('hidden');currentToken='';currentValidation=null;startCamera()};
$('adminMode').onchange=()=>{if(currentValidation)renderValidation(currentValidation)};
$('logoutBtn').onclick=async()=>{await stopCamera();await sb.auth.signOut();showLogin();setNet(false,'ODJAVLJEN')};

window.addEventListener('online',()=>setNet(true,'ONLINE'));
window.addEventListener('offline',()=>setNet(false,'OFFLINE'));

bootstrapSession().catch(e=>{
  showLogin();
  msg($('loginMsg'),String(e?.message||e),'bad');
});
})();
</script>
</body>
</html>
